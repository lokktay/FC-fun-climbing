                                </div>
                                <div class="bg-gradient-to-r from-orange-900/60 to-purple-950/60 border border-orange-500/30 rounded-3xl p-6 mb-6 text-center shadow-lg">
                                    <h2 class="text-2xl font-black text-orange-400 mb-2">${activeEventInfo.emoji} ${escapeHtml(eventConfig.title)} (${halloweenLevel})</h2>
                                    <p class="text-slate-300 text-sm">${escapeHtml(eventConfig.description)}</p>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
                        `;

                        currentAteliers.forEach(atelier => {
                            const val = halloweenInputs[atelier.id] !== undefined ? halloweenInputs[atelier.id] : '';
                            const status = halloweenStatus[atelier.id];
                            let borderClass = 'border-slate-800';
                            let shakeClass = '';

                            if (status === 'correct') { borderClass = 'border-emerald-500 bg-emerald-950/20'; } 
                            else if (status === 'error') { borderClass = 'border-red-500 bg-red-950/20'; shakeClass = 'shake-error'; }

                            html += `
                                <div class="bg-slate-900 border ${borderClass} rounded-2xl p-4 flex flex-col justify-between shadow-md ${shakeClass}">
                                    <div>
                                        <div class="h-24 rounded-xl overflow-hidden relative mb-3">${getAtelierPreview(atelier)}<div class="absolute inset-0 bg-black/30"></div></div>
                                        <h3 class="text-slate-100 font-bold text-sm mb-3">${escapeHtml(atelier.name)}</h3>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <input type="number" placeholder="Réponse..." value="${escapeHtml(val)}" oninput="handleHalloweenInput('${atelier.id}', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center text-sm outline-none focus:border-orange-500" />
                                        ${status === 'correct' ? '<span class="text-emerald-400 font-bold text-lg">✓</span>' : status === 'error' ? '<span class="text-red-500 font-bold text-lg">✗</span>' : ''}
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                                </div>
                                <div class="flex justify-center pb-8">
                                    <button id="verifyBtn" onclick="verifyHalloweenAnswers()" ${!filled ? 'disabled' : ''} class="px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 ${filled ? 'bg-orange-600 text-white shadow-orange-900/50 hover:bg-orange-500 cursor-pointer active:scale-95' : 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-60'}">
                                        <i data-lucide="check-circle" class="w-6 h-6"></i> Vérifier mes réponses
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                } else if (currentTab === 'recompenses') {
                    const currentProfile = allUsersData.find(user => user.id === userId);
                    const redeemedRewards = Array.isArray(currentProfile && currentProfile.redeemedRewards)
                        ? currentProfile.redeemedRewards
                        : [];
                    const earnedRewards = getEarnedMonthlyRewardEntries(completedDefis);
                    html += `
                        <section class="mx-4 mt-6 space-y-4 rounded-3xl border border-purple-100 bg-white/95 p-5 shadow-lg sm:p-7" aria-label="Mes cadeaux gagnés">
                            <div>
                                <p class="text-xs font-black uppercase tracking-[0.18em] text-purple-600">${escapeHtml(pseudo)} · Historique</p>
                                <h1 class="mt-1 text-2xl font-black text-slate-900">Mes cadeaux</h1>
                                <p class="mt-2 text-sm text-gray-600">Présente à l'accueil les cadeaux ouverts pour les récupérer. L'équipe les marquera comme récupérés.</p>
                            </div>
                            ${earnedRewards.length ? `<div class="space-y-3">
                                ${earnedRewards.map(({ reward, monthKey, claimKey }) => {
                                    const opened = openedMonthlyRewards.includes(claimKey);
                                    const redeemed = redeemedRewards.includes(claimKey);
                                    return `
                                        <article class="flex flex-col gap-3 rounded-2xl border border-purple-100 bg-purple-50/60 p-4 sm:flex-row sm:items-center">
                                            <div class="flex h-20 w-20 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-white shadow-sm">
                                                ${opened && rewardImages[reward.id]
                                                    ? `<img src="${escapeHtml(rewardImages[reward.id])}" alt="${escapeHtml(reward.title)}" class="h-full w-full object-cover" />`
                                                    : `<span class="text-4xl" aria-hidden="true">🎁</span>`}
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                ${opened ? `<h2 class="font-black text-slate-900">${escapeHtml(reward.title)}</h2>` : '<h2 class="font-black text-slate-900">Cadeau à révéler</h2>'}
                                                <p class="mt-1 text-sm text-gray-600">${monthKey} · ${reward.points} pts · ${opened ? escapeHtml(reward.description || 'Cadeau obtenu') : 'Ouvre le cadeau pour découvrir ce que tu as gagné.'}</p>
                                                <p class="mt-2 text-xs font-black uppercase tracking-wide ${redeemed ? 'text-emerald-700' : 'text-amber-700'}">${redeemed ? 'Récupéré à l’accueil' : opened ? 'À présenter à l’accueil' : 'À révéler'}</p>
                                            </div>
                                            ${!opened ? `<button type="button" onclick="openMonthlyReward('${escapeHtml(reward.id)}', '${escapeHtml(monthKey)}')" class="rounded-xl bg-purple-600 px-4 py-3 text-sm font-black text-white hover:bg-purple-700">Ouvrir mon cadeau</button>` : ''}
                                        </article>
                                    `;
                                }).join('')}
                            </div>` : '<div class="rounded-2xl bg-gray-50 p-6 text-center text-sm font-bold text-gray-500">Aucun cadeau gagné pour le moment. Continue à marquer des points pour débloquer le prochain !</div>'}
                            ${rewardError ? `<p role="alert" class="text-sm font-bold text-red-600">${escapeHtml(rewardError)}</p>` : ''}
                        </section>
                    `;
                } else {
                    let usersList = [...allUsersData];
                    if (isLogged) {
                        const myIndex = usersList.findIndex(u => u.id === userId);
                        if (myIndex >= 0) {
                            usersList[myIndex].completedDefis = completedDefis;
                            usersList[myIndex].pseudo = pseudo;
                        } else {
                            usersList.push({ id: userId, pseudo: pseudo, completedDefis: completedDefis });
                        }
                    }

                    // SÉCURITÉ AJOUTÉE ICI : "u.pseudo || 'Anonyme'" empêche tout undefined
                    const usersScores = usersList.map(u => {
                        const scores = calculateUserScores(u.completedDefis || {});
                        return { 
                            pseudo: u.pseudo || 'Anonyme', 
                            daily: scores.daily, 
                            weekly: scores.weekly, 
                            monthly: scores.monthly,
                            isCurrent: u.id === userId 
                        };
                    });

                    const dbJour = usersScores.filter(u => u.daily > 0).sort((a,b) => b.daily - a.daily).map((u, i) => ({...u, rank: i+1, score: u.daily}));
                    const dbSemaine = usersScores.filter(u => u.weekly > 0).sort((a,b) => b.weekly - a.weekly).map((u, i) => ({...u, rank: i+1, score: u.weekly}));
                    const dbMois = usersScores.filter(u => u.monthly > 0).sort((a,b) => b.monthly - a.monthly).map((u, i) => ({...u, rank: i+1, score: u.monthly}));

                    const buildTable = (data, title, subtitle, bgColor) => `
                        <div class="flex-1 bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
                            <div class="${bgColor} p-6 text-white text-center">
                                <h2 class="text-2xl font-black mb-1">${title}</h2>
                                <p class="text-white/80 text-sm opacity-80">${subtitle}</p>
                            </div>
                            <div class="divide-y divide-gray-50">
                                ${data.length === 0 ? `<div class="p-8 text-center text-gray-400 font-bold">Aucun score pour le moment !</div>` : ''}
                                ${data.map(p => `
                                    <div class="flex items-center p-4 ${p.isCurrent ? 'bg-purple-50' : 'hover:bg-gray-50'}">
                                        <div class="w-8 font-black text-lg ${p.rank === 1 ? 'text-yellow-500' : p.rank === 2 ? 'text-gray-400' : p.rank === 3 ? 'text-orange-500' : 'text-gray-300'}">#${p.rank}</div>
                                        <div class="flex-1 font-bold ${p.isCurrent ? 'text-purple-700' : 'text-gray-700'}">
                                            ${p.pseudo} ${p.isCurrent ? `<span class="ml-2 text-xs bg-purple-200 text-purple-700 px-2 py-0.5 rounded-full uppercase">Toi</span>` : ''}
                                        </div>
                                        <div class="font-black ${bgColor.includes('purple') ? 'text-purple-600 bg-purple-100' : 'text-teal-600 bg-teal-100'} px-3 py-1 rounded-full text-sm">${p.score} pts</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    html += `
                        <div class="p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <div class="flex bg-gray-200 rounded-xl p-1 lg:hidden mb-2 col-span-full">
                                <button onclick="changeLeaderboardTab('jour')" class="flex-1 py-2 font-bold rounded-lg transition-colors ${leaderboardTab === 'jour' ? 'bg-white text-gray-800 shadow' : 'text-gray-500'}">Aujourd'hui</button>
                                <button onclick="changeLeaderboardTab('semaine')" class="flex-1 py-2 font-bold rounded-lg transition-colors ${leaderboardTab === 'semaine' ? 'bg-white text-gray-800 shadow' : 'text-gray-500'}">Cette Semaine</button>
                                <button onclick="changeLeaderboardTab('mois')" class="flex-1 py-2 font-bold rounded-lg transition-colors ${leaderboardTab === 'mois' ? 'bg-white text-gray-800 shadow' : 'text-gray-500'}">Ce Mois</button>
                            </div>
                            <div class="${leaderboardTab !== 'jour' ? 'hidden lg:block' : ''}">${buildTable(dbJour, "Top du Jour", "Réinitialisation à minuit", "bg-gradient-to-r from-purple-600 to-purple-500")}</div>
                            <div class="${leaderboardTab !== 'semaine' ? 'hidden lg:block' : ''}">${buildTable(dbSemaine, "Top de la Semaine", "Réinitialisation lundi à minuit", "bg-gradient-to-r from-teal-500 to-teal-400")}</div>
                            <div class="${leaderboardTab !== 'mois' ? 'hidden lg:block' : ''}">${buildTable(dbMois, "Top du Mois", "Réinitialisation le 1er du mois", "bg-gradient-to-r from-orange-500 to-orange-400")}</div>
                        </div>
                    `;
                }

                html += `</main>`;

                html += `
                    <nav class="app-mobile-nav md:hidden fixed bottom-0 left-0 right-0 ${isHalloween ? 'bg-slate-900 border-t border-orange-500/30' : 'bg-white border-t border-gray-100'} flex shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40">
                        <button onclick="changeTab('carte')" class="flex-1 flex flex-col items-center justify-center px-1 py-2 gap-1 ${currentTab === 'carte' ? (isHalloween ? 'text-orange-400' : 'text-purple-600') : 'text-gray-400'}">
                            <i data-lucide="map" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase tracking-wider">Carte</span>
                        </button>
                        ${challengeAvailable ? `<button onclick="changeTab('defi_mois')" class="flex-1 flex flex-col items-center justify-center px-1 py-2 gap-1 ${currentTab === 'defi_mois' ? (isHalloween ? 'text-orange-400 font-black' : 'text-purple-600') : 'text-gray-400'}">
                            <i data-lucide="${activeEventInfo.icon}" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase tracking-wider">${activeEventInfo.label}</span>
                        </button>` : ''}
                        <button onclick="changeTab('classement')" class="flex-1 flex flex-col items-center justify-center px-1 py-2 gap-1 ${currentTab === 'classement' ? (isHalloween ? 'text-orange-400' : 'text-purple-600') : 'text-gray-400'}">
                            <i data-lucide="medal" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase tracking-wider">Classement</span>
                        </button>
                        ${appSettings.monthlyRewardsEnabled && appSettings.monthlyRewards.length ? `<button onclick="changeTab('recompenses')" class="flex-1 flex flex-col items-center justify-center px-1 py-2 gap-1 ${currentTab === 'recompenses' ? (isHalloween ? 'text-orange-400' : 'text-purple-600') : 'text-gray-400'}">
                            <i data-lucide="gift" class="w-6 h-6"></i><span class="text-[10px] font-bold uppercase tracking-wider">Cadeaux</span>
                        </button>` : ''}
                    </nav>
                `;

                if (selectedAtelierId && !ATELIERS.some(atelier => atelier.id === selectedAtelierId)) {
                    selectedAtelierId = null;
                }
                if (selectedAtelierId) {
                    const atelier = ATELIERS.find(a => a.id === selectedAtelierId);
                    
                    const pointDefis = atelier.defis.filter(defi => defi.rewardType !== 'gift');
                    const atelierScore = pointDefis.reduce((acc, curr) => acc + (completedDefis[curr.id] ? curr.points : 0), 0);
                    const maxScore = pointDefis.reduce((acc, curr) => acc + curr.points, 0);

                    html += `
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex flex-col justify-end md:justify-center md:items-center">
                            <div class="bg-gray-50 text-gray-800 w-full md:w-[450px] md:rounded-3xl rounded-t-3xl min-h-[60vh] md:min-h-0 flex flex-col overflow-hidden shadow-2xl modal-animate">
                                <div class="relative h-40 w-full">
                                    ${getAtelierPreview(atelier)}
                                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                                    <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/40 backdrop-blur-md text-white p-2 rounded-full hover:bg-black/60 transition">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                    <h2 class="absolute bottom-4 left-6 text-white text-3xl font-black drop-shadow-md">${escapeHtml(atelier.name)}</h2>
                                </div>
                                
                                <div class="p-6 space-y-3 flex-1 overflow-y-auto max-h-[50vh]">
                                    <p class="text-gray-500 font-medium mb-4">Valide les défis pour obtenir les points ou cadeaux indiqués.</p>
                                    ${atelier.defis.map(defi => {
                                        const isDone = completedDefis[defi.id];
                                        const color = getChallengeColor(defi);
                                        return `
                                            <button onclick="toggleDefi('${defi.id}')" class="w-full flex items-center p-4 rounded-2xl border-2 text-left transition-all ${color.card} ${isDone ? 'shadow-sm' : 'opacity-85 hover:opacity-100'}">
                                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 flex-shrink-0 transition-colors ${isDone ? `${color.completed} border-white text-white` : 'border-current/30 bg-white/70'}">
                                                    ${isDone ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ''}
                                                </div>
                                                <div class="flex-1"><p class="font-bold leading-tight">${escapeHtml(defi.text)}</p></div>
                                                <div class="ml-3 rounded-full px-3 py-1 text-xs font-black ${color.reward}">${defi.rewardType === 'gift' ? escapeHtml(getChallengeRewardLabel(defi)) : `+${defi.points} pts`}</div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                
                                <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center pb-safe">
                                    <div>
                                        <div class="text-gray-500 font-bold">Points sur cet atelier</div>
                                        ${atelier.defis.some(defi => defi.rewardType === 'gift') ? '<div class="mt-1 text-xs font-medium text-gray-500">Les cadeaux sont indiqués sur chaque défi.</div>' : ''}
                                    </div>
                                    <div class="text-right font-black text-purple-600">${maxScore ? `<span class="text-2xl">${atelierScore}</span> <span class="text-sm text-gray-400 font-bold ml-1">/ ${maxScore} pts</span>` : '<span class="text-sm text-gray-500">Cadeaux uniquement</span>'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (selectedRewardId) {
                    const reward = appSettings.monthlyRewards.find(item => item.id === selectedRewardId);
                    if (reward) {
                        html += `
                            <div class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/75 p-4 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="monthly-reward-title">
                                <section class="reward-reveal relative w-full max-w-lg overflow-hidden rounded-[2rem] border border-white/30 bg-white text-center shadow-2xl">
                                    <button type="button" onclick="closeMonthlyReward()" aria-label="Fermer le cadeau" class="absolute right-4 top-4 z-10 rounded-full bg-slate-950/70 p-2 text-white transition hover:bg-slate-950">
                                        <i data-lucide="x" class="h-5 w-5"></i>
                                    </button>
                                    <div class="absolute inset-0 bg-gradient-to-br from-violet-600/10 via-transparent to-teal-400/20"></div>
                                    <div class="relative p-6 sm:p-8">
                                        <p class="mb-3 text-xs font-black uppercase tracking-[.25em] text-purple-700">Cadeau débloqué · ${reward.points} points</p>
                                        <div class="mx-auto mb-5 flex aspect-[4/3] max-h-72 items-center justify-center overflow-hidden rounded-3xl bg-gradient-to-br from-purple-100 to-teal-100 shadow-inner">
                                            ${rewardImages[reward.id] ? `<img src="${escapeHtml(rewardImages[reward.id])}" alt="${escapeHtml(reward.title)}" class="h-full w-full object-contain" />` : '<span class="text-8xl" aria-hidden="true">🎁</span>'}
                                        </div>
                                        <h2 id="monthly-reward-title" class="text-3xl font-black text-slate-900">${escapeHtml(reward.title)}</h2>
                                        ${reward.description ? `<p class="mt-3 text-base leading-relaxed text-slate-600">${escapeHtml(reward.description)}</p>` : ''}
                                        <p class="mt-4 text-xs font-bold uppercase tracking-wider text-emerald-700">À présenter à l’accueil pour récupérer ton cadeau</p>
                                        <button type="button" onclick="closeMonthlyReward()" class="mt-6 w-full rounded-2xl bg-gradient-to-r from-purple-600 to-teal-500 px-5 py-3 font-black text-white shadow-lg transition hover:brightness-105">Voir mes cadeaux</button>
                                    </div>
                                </section>
                            </div>
                        `;
                    } else {
                        selectedRewardId = null;
                    }
                }

                html += `</div>`;
                app.innerHTML = html;
            }

            if (window.lucide) { lucide.createIcons(); }
        }

        // --- CYCLE DE VIE (INIT & ÉCOUTE FIREBASE) ---
        async function initApp() {
            render(); 
            window.setInterval(() => {
                if (adminAuthorized && currentTab === 'admin' && adminTab === 'retraits'
                    && getCurrentRewardDayKey() !== rewardReceptionDayKey) {
                    syncRewardReceptionListeners();
                }
            }, 60000);
            
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsersData = [];
                let currentProfileChanged = false;
                snapshot.forEach((userDoc) => {
                    const userData = { id: userDoc.id, ...userDoc.data() };
                    allUsersData.push(userData);
                    if (userDoc.id === userId) {
                        if (typeof userData.pseudo === 'string' && userData.pseudo && userData.pseudo !== pseudo) {
                            pseudo = userData.pseudo;
                            localStorage.setItem('climbup_pseudo', pseudo);
                            currentProfileChanged = true;
                        }
                        if (Array.isArray(userData.openedRewards)) {
                            const mergedOpenedRewards = [...new Set([...openedMonthlyRewards, ...userData.openedRewards.filter(item => typeof item === 'string')])];
                            if (mergedOpenedRewards.length !== openedMonthlyRewards.length) currentProfileChanged = true;
                            openedMonthlyRewards = mergedOpenedRewards;
                            localStorage.setItem(openedMonthlyRewardsStorageKey, JSON.stringify(openedMonthlyRewards));
                        }
                    }
                });
                if (currentTab === 'classement' || currentTab === 'admin' || currentTab === 'recompenses' || currentProfileChanged) render();
            }, (error) => {
                console.error("Écoute des profils Firebase échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "Les profils et statistiques ne sont pas accessibles. Vérifie les règles Firestore.";
                    render();
                }
            });

            onSnapshot(collection(db, "workshopImages"), (snapshot) => {
                const nextImages = {};
                snapshot.forEach(imageDoc => {
                    const imageDataUrl = imageDoc.data().imageDataUrl;
                    if (typeof imageDataUrl === 'string'
                        && imageDataUrl.length <= 300000
                        && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(imageDataUrl)) {
                        nextImages[imageDoc.id] = imageDataUrl;
                    }
                });
                workshopImages = nextImages;
                if (currentTab === 'carte' || currentTab === 'admin' || selectedAtelierId) render();
            }, error => {
                console.error("Lecture des miniatures d'ateliers échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "Les miniatures d'ateliers ne sont pas accessibles. Vérifie les règles Firestore.";
                    render();
                }
            });

            onSnapshot(collection(db, "rewardImages"), (snapshot) => {
                const nextImages = {};
                snapshot.forEach(imageDoc => {
                    const imageDataUrl = imageDoc.data().imageDataUrl;
                    if (typeof imageDataUrl === 'string'
                        && imageDataUrl.length <= 300000
                        && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(imageDataUrl)) {
                        nextImages[imageDoc.id] = imageDataUrl;
                    }
                });
                rewardImages = nextImages;
                if (currentTab === 'admin' || (isLogged && appSettings.monthlyRewardsEnabled) || selectedRewardId) render();
            }, error => {
                console.error("Lecture des visuels cadeaux échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "Les visuels des cadeaux ne sont pas accessibles. Vérifie les règles Firestore.";
                    render();
                }
            });

            onSnapshot(doc(db, "appConfig", "main"), (snapshot) => {
                if (snapshot.exists()) applyAppConfiguration(snapshot.data());
                if (currentTab !== 'admin' || snapshot.exists()) render();
            }, (error) => {
                console.error("Lecture de la configuration de l'application échouée :", error);
                appConfigError = "La configuration partagée n'a pas pu être lue. Vérifie les règles Firestore.";
                if (currentTab === 'admin') render();
            });

            onAuthStateChanged(auth, async user => {
                adminUser = user;
                adminAuthorized = false;
                if (user) {
                    try {
                        const token = await user.getIdTokenResult(true);
                        adminAuthorized = token.claims.admin === true;
                        if (!adminAuthorized && currentTab === 'admin') {
                            adminError = "Ce compte Firebase ne possède pas le rôle administrateur.";
                        }
                    } catch (error) {
                        console.error("Vérification du rôle admin échouée :", error);
                        adminError = "Impossible de vérifier les droits administrateur.";
                    }
                }
                syncRewardReceptionListeners();
                if (currentTab === 'admin') render();
            }, error => {
                console.error("Écoute de la session Firebase échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "La session administrateur n'a pas pu être vérifiée.";
                    render();
                }
            });
        }

        initApp();
    </script>
</body>
</html>
