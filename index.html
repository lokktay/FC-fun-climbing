    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes climbBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .modal-animate {
            animation: slideUp 0.3s ease-out forwards;
        }
        .climby-bounce {
            animation: climbBounce 2s ease-in-out infinite;
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>

        let climbyInputs = {}; 
        let climbySubmitted = false;

        function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('pseudoInput');
            if (input.value.trim()) {
                pseudo = input.value.trim();
                isLogged = true;
                render();
            }
        }

        function calculateScore() {
            let total = 0;
            ATELIERS.forEach(atelier => {
                atelier.defis.forEach(defi => {
                    if (completedDefis[defi.id]) total += defi.points;
                });
            });
            return total;
        }

        function toggleDefi(defiId) {
            completedDefis[defiId] = !completedDefis[defiId];
            render();
        }

        function openModal(id) {
            selectedAtelierId = id;
            render();
        }

        function closeModal() {
            selectedAtelierId = null;
            render();
        }

        function changeTab(tab) {
            currentTab = tab;
            if (tab === 'defi_mois') {
                climbyLevel = null; 
                climbyInputs = {};
                climbyStatus = {};
                climbySubmitted = false;
            }
            render();
        }

            render();
        }

        function selectClimbyLevel(lvl) {
            climbyLevel = lvl;
            climbyInputs = {};
            climbyStatus = {};
            climbySubmitted = false;
            render();
        }

        function handleClimbyInput(atelierId, val) {
            climbyInputs[atelierId] = val;
            if (climbyStatus[atelierId]) {
                delete climbyStatus[atelierId];
            }
            const btn = document.getElementById('verifyBtn');
            if (btn) {
                if (areAllFilled()) {
                    btn.disabled = false;
                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-purple-600 text-white shadow-purple-900/30 hover:bg-purple-500 cursor-pointer active:scale-95";
                } else {
                    btn.disabled = true;
                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-gray-200 text-gray-400 cursor-not-allowed opacity-60";
                }
            }
        }

        function getActiveAteliersForLevel() {
            if (!climbyLevel) return [];
            const ids = DIFF_GROUPES[climbyLevel];
            return ATELIERS.filter(a => ids.includes(a.id));
        }

        function areAllFilled() {
            const currentAteliers = getActiveAteliersForLevel();
            if (currentAteliers.length === 0) return false;
            return currentAteliers.every(atelier => {
                const val = climbyInputs[atelier.id];
                return val !== undefined && val !== '' && val !== null && String(val).trim() !== '';
            });
        }

        function verifyClimbyAnswers() {
            const currentAteliers = getActiveAteliersForLevel();
            let allCorrect = true;
            climbyStatus = {};

            currentAteliers.forEach(atelier => {
                const userVal = Number(climbyInputs[atelier.id]);
                const correctVal = Number(REPONSES_CLIMBY[atelier.id]);
                if (userVal === correctVal) {
                    climbyStatus[atelier.id] = 'correct';
                } else {
                    climbyStatus[atelier.id] = 'error';
                    allCorrect = false;
                }
            });

            climbySubmitted = true;
            render();
        }

        function isClimbyCompleted() {
            if (!climbyLevel || !climbySubmitted) return false;
            const currentAteliers = getActiveAteliersForLevel();
            return currentAteliers.every(atelier => {
                return Number(climbyInputs[atelier.id]) === Number(REPONSES_CLIMBY[atelier.id]);
            });
        }

        // --- RENDU ---
        function render() {
            const app = document.getElementById('app');
            const isClimbyTab = (currentTab === 'defi_mois');

            if (!isLogged) {
                app.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-purple-600 to-teal-400 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
                            <div class="w-24 h-24 bg-gradient-to-br from-purple-500 to-teal-400 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg">
                                <i data-lucide="trophy" class="text-white w-12 h-12"></i>
                            </div>
                            <h1 class="text-3xl font-black text-gray-800 mb-2">Climb Up</h1>
                            <p class="text-gray-500 mb-8 font-medium">Fun Climbing - Défis</p>
                            
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <input type="text" id="pseudoInput" placeholder="Choisis ton pseudo..." class="w-full px-4 py-4 rounded-xl bg-gray-50 border-2 border-gray-100 focus:border-purple-500 focus:ring-0 transition-colors text-lg text-center font-bold text-gray-700 outline-none" required />
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95 text-lg">
                                    C'est parti !
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            } else {
                const totalScore = calculateScore();

                let html = `
                    <div class="min-h-screen bg-gray-50 text-gray-800 pb-24 md:pb-8">
                        <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 bg-gradient-to-br from-purple-600 to-teal-500 rounded-full flex items-center justify-center text-white font-bold">
                                    <i data-lucide="mountain" class="w-4 h-4"></i>
                                </div>
                                <span class="font-black text-xl bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-teal-500">Climb Up</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right hidden md:block">
                                    <p class="text-xs text-gray-500 font-bold uppercase">${pseudo}</p>
                                </div>
                                <div class="bg-purple-100 border border-purple-200 text-purple-700 px-4 py-2 rounded-full shadow-sm flex items-center gap-2">
                                    <span class="font-black text-lg">${totalScore}</span>
                                    <span class="text-xs font-bold uppercase">pts</span>
                                </div>
                            </div>
                        </header>
                        
                        <div class="hidden md:flex justify-center gap-4 p-6">
                            <button onclick="changeTab('carte')" class="px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${currentTab === 'carte' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-gray-600 shadow'}">
                                <i data-lucide="map"></i> La Carte
                            </button>
                            <button onclick="changeTab('defi_mois')" class="px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${currentTab === 'defi_mois' ? 'bg-purple-600 text-white shadow-lg shadow-purple-900/20' : 'bg-white text-purple-600 border border-purple-200 shadow'}">
                                <i data-lucide="sparkles"></i> Le Défi de Climby 🏔️
                            </button>
                            <button onclick="changeTab('classement')" class="px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${currentTab === 'classement' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-gray-600 shadow'}">
                                <i data-lucide="medal"></i> Classement
                            </button>
                        </div>
                        
                        <main class="max-w-6xl mx-auto md:px-6">
                `;

                if (currentTab === 'carte') {
                    html += `<div class="grid grid-cols-2 gap-3 sm:gap-4 p-4 md:grid-cols-4 lg:grid-cols-5">`;
                    ATELIERS.forEach(atelier => {
                        const totalDefis = atelier.defis.length;
                        const completed = atelier.defis.filter(d => completedDefis[d.id]).length;
                        const isAllCompleted = completed === totalDefis;
                        
                        html += `
                            <button onclick="openModal('${atelier.id}')" class="relative overflow-hidden rounded-3xl aspect-square shadow-md transform transition-transform active:scale-95 ${isAllCompleted ? 'ring-4 ring-teal-400 ring-offset-2' : ''}">
                                ${atelier.preview}
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-900/40 to-transparent flex flex-col justify-end p-3 sm:p-4">
                                    <h3 class="text-white font-bold text-sm sm:text-base mb-2 drop-shadow-md text-left leading-tight">${atelier.name}</h3>
                                    <div class="flex gap-1">
                                        ${atelier.defis.map(d => `<div class="h-1.5 flex-1 rounded-full transition-colors ${completedDefis[d.id] ? 'bg-teal-400 shadow-[0_0_8px_rgba(45,212,191,0.8)]' : 'bg-white/30 backdrop-blur-sm'}"></div>`).join('')}
                                    </div>
                                </div>
                                ${isAllCompleted ? `<div class="absolute top-2 right-2 bg-teal-400 text-white p-1 rounded-full shadow-lg"><i data-lucide="check" class="w-4 h-4 text-white"></i></div>` : ''}
                            </button>
                        `;
                    });
                    html += `</div>`;
                } 
                else if (currentTab === 'defi_mois') {
                    if (!climbyLevel) {
                        html += `
                            <div class="p-6 flex flex-col items-center justify-center text-center py-12">
                                <div class="w-24 h-24 bg-purple-100 border-2 border-purple-200 rounded-full flex items-center justify-center mb-4 shadow-inner overflow-hidden climby-bounce">
                                    <svg viewBox="0 0 100 100" class="w-16 h-16 text-purple-600 fill-current"><circle cx="50" cy="40" r="20"/><path d="M 20 85 Q 50 60 80 85 Z"/></svg>
                                </div>
                                <h2 class="text-3xl font-black text-gray-800 mb-2">Le Défi de Climby 🏔️</h2>
                                <p class="text-gray-500 text-sm mb-8 max-w-md">Climby le Yéti t'invite à retrouver les nombres cachés dans la salle ! Choisis ton niveau de difficulté :</p>
                                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                                    <button onclick="selectClimbyLevel('facile')" class="flex-1 bg-white border-2 border-emerald-500 hover:bg-emerald-50 text-emerald-600 font-black py-5 rounded-2xl shadow-md transition active:scale-95 text-lg flex items-center justify-center gap-2">
                                        🟢 Facile
                                    </button>
                                    <button onclick="selectClimbyLevel('moyen')" class="flex-1 bg-white border-2 border-amber-500 hover:bg-amber-50 text-amber-600 font-black py-5 rounded-2xl shadow-lg transition active:scale-95 text-lg flex items-center justify-center gap-2">
                                        🟠 Moyen
                                    </button>
                                    <button onclick="selectClimbyLevel('difficile')" class="flex-1 bg-white border-2 border-red-500 hover:bg-red-50 text-red-600 font-black py-5 rounded-2xl shadow-lg transition active:scale-95 text-lg flex items-center justify-center gap-2">
                                        🔴 Difficile
                                    </button>
                                </div>
                            </div>
                        `;
                    } else if (isClimbyCompleted()) {
                        html += `
                            <div class="p-6 flex flex-col items-center justify-center text-center py-16">
                                <div class="w-32 h-32 bg-purple-600 text-white rounded-full flex items-center justify-center shadow-xl mb-6 animate-bounce">
                                    <i data-lucide="award" class="w-16 h-16"></i>
                                </div>
                                <h1 class="text-4xl font-black text-purple-700 mb-4">🏆 BRAVO AVEC CLIMBY (${climbyLevel.toUpperCase()}) ! 🎉</h1>
                                <p class="text-gray-600 text-lg max-w-xl mb-8">
                                    Félicitations <span class="font-bold text-purple-600">${pseudo}</span> ! Tu as résolu tous les ateliers du niveau ${climbyLevel} avec succès !
                                </p>
                                <div class="bg-white border-2 border-purple-200 p-6 rounded-3xl shadow-xl max-w-md w-full mb-8">
                                    <p class="text-purple-700 font-bold mb-2">✨ Écran à présenter à l'accueil :</p>
                                    <div class="bg-gray-900 text-teal-400 p-4 rounded-xl font-mono text-xl font-black tracking-wider shadow-inner">
                                        [ VALIDÉ - CLIMBY ${climbyLevel.toUpperCase()} ]
                                    </div>
                                </div>
                                <button onclick="climbyLevel = null; render();" class="text-sm text-purple-600 underline hover:text-purple-800 font-bold">Changer de niveau ou recommencer</button>
                            </div>
                        `;
                    } else {
                        const currentAteliers = getActiveAteliersForLevel();
                        const filled = areAllFilled();

                        html += `
                            <div class="p-4">
                                <div class="flex justify-between items-center mb-6">
                                    <button onclick="climbyLevel = null; render();" class="text-xs bg-white text-purple-600 px-3 py-2 rounded-xl font-bold border border-purple-200 hover:bg-purple-50 transition shadow-sm">← Changer de difficulté (${climbyLevel})</button>
                                </div>
                                <div class="bg-gradient-to-r from-purple-600 to-teal-500 text-white rounded-3xl p-6 mb-6 text-center shadow-lg flex flex-col md:flex-row items-center justify-center gap-4">
                                    <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="mountain" class="w-8 h-8 text-white"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-2xl font-black mb-1">🏔️ Le Défi de Climby (${climbyLevel})</h2>
                                        <p class="text-white/90 text-sm">Remplis tous les nombres des ateliers de ce niveau pour valider ton ascension avec le yéti !</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
                        `;

                        currentAteliers.forEach(atelier => {
                            const val = climbyInputs[atelier.id] !== undefined ? climbyInputs[atelier.id] : '';
                            const status = climbyStatus[atelier.id];
                            let borderClass = 'border-gray-200 bg-white';
                            let shakeClass = '';

                            if (status === 'correct') {
                                borderClass = 'border-teal-500 bg-teal-50';
                            } else if (status === 'error') {
                                borderClass = 'border-red-500 bg-red-50';
                                shakeClass = 'shake-error';
                            }

                            html += `
                                <div class="border ${borderClass} rounded-2xl p-4 flex flex-col justify-between shadow-sm ${shakeClass}">
                                    <div>
                                        <div class="h-24 rounded-xl overflow-hidden relative mb-3">
                                            ${atelier.preview}
                                            <div class="absolute inset-0 bg-black/20"></div>
                                        </div>
                                        <h3 class="text-gray-800 font-bold text-sm mb-3">${atelier.name}</h3>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <input type="number" placeholder="Nombre..." value="${val}" oninput="handleClimbyInput('${atelier.id}', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-800 font-bold text-center text-sm outline-none focus:border-purple-500" />
                                        ${status === 'correct' ? '<span class="text-teal-600 font-bold text-lg">✓</span>' : status === 'error' ? '<span class="text-red-500 font-bold text-lg">✗</span>' : ''}
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                                </div>
                                <div class="flex justify-center pb-8">
                                    <button id="verifyBtn" onclick="verifyClimbyAnswers()" ${!filled ? 'disabled' : ''} class="px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 ${filled ? 'bg-purple-600 text-white shadow-purple-900/30 hover:bg-purple-500 cursor-pointer active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed opacity-60'}">
                                        <i data-lucide="check-circle" class="w-6 h-6"></i> Vérifier mes réponses
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                } 
                else {
                    const dummyJour = [
                        { rank: 1, pseudo: "SpiderMan", score: 145 }, { rank: 2, pseudo: "ClimbPro99", score: 120 }, { rank: 3, pseudo: pseudo, score: totalScore, isCurrent: true },
                        { rank: 4, pseudo: "NinjaWarrior", score: 95 }, { rank: 5, pseudo: "Rookie", score: 40 }
                    ].sort((a,b) => b.score - a.score).map((p, i) => ({...p, rank: i+1}));

                    const dummySemaine = [
                        { rank: 1, pseudo: "ProClimber", score: 450 }, { rank: 2, pseudo: "AlexHonnold", score: 435 }, { rank: 3, pseudo: "SpiderMan", score: 380 },
                        { rank: 4, pseudo: "NinjaWarrior", score: 310 }, { rank: 5, pseudo: pseudo, score: totalScore, isCurrent: true }
                    ].sort((a,b) => b.score - a.score).map((p, i) => ({...p, rank: i+1}));

                    const buildTable = (data, title, subtitle, bgColor) => `
                        <div class="flex-1 bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
                            <div class="${bgColor} p-6 text-white text-center">
                                <h2 class="text-2xl font-black mb-1">${title}</h2>
                                <p class="text-white/80 text-sm opacity-80">${subtitle}</p>
                            </div>
                            <div class="divide-y divide-gray-50">
                                ${data.map(p => `
                                    <div class="flex items-center p-4 ${p.isCurrent ? 'bg-purple-50' : 'hover:bg-gray-50'}">
                                        <div class="w-8 font-black text-lg ${p.rank === 1 ? 'text-yellow-500' : p.rank === 2 ? 'text-gray-400' : p.rank === 3 ? 'text-orange-500' : 'text-gray-300'}">#${p.rank}</div>
                                        <div class="flex-1 font-bold ${p.isCurrent ? 'text-purple-700' : 'text-gray-700'}">
                                            ${p.pseudo} ${p.isCurrent ? `<span class="ml-2 text-xs bg-purple-200 text-purple-700 px-2 py-0.5 rounded-full uppercase">Toi</span>` : ''}
                                        </div>
                                        <div class="font-black ${bgColor.includes('purple') ? 'text-purple-600 bg-purple-100' : 'text-teal-600 bg-teal-100'} px-3 py-1 rounded-full text-sm">${p.score} pts</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    html += `
                        <div class="p-4 flex flex-col md:flex-row gap-6">
                            <div class="flex bg-gray-200 rounded-xl p-1 md:hidden mb-4">
                                <button onclick="changeLeaderboardTab('jour')" class="flex-1 py-2 font-bold rounded-lg transition-colors ${leaderboardTab === 'jour' ? 'bg-white text-gray-800 shadow' : 'text-gray-500'}">Aujourd'hui</button>
                                <button onclick="changeLeaderboardTab('semaine')" class="flex-1 py-2 font-bold rounded-lg transition-colors ${leaderboardTab === 'semaine' ? 'bg-white text-gray-800 shadow' : 'text-gray-500'}">Cette Semaine</button>
                            </div>
                            <div class="${leaderboardTab !== 'jour' ? 'hidden md:block flex-1' : 'flex-1'}">${buildTable(dummyJour, "Top du Jour", "Reset à minuit", "bg-gradient-to-r from-purple-600 to-purple-500")}</div>
                            <div class="${leaderboardTab !== 'semaine' ? 'hidden md:block flex-1' : 'flex-1'}">${buildTable(dummySemaine, "Top de la Semaine", "Reset dimanche à minuit", "bg-gradient-to-r from-teal-500 to-teal-400")}</div>
                        </div>
                    `;
                }

                html += `</main>`;

                html += `
                    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 flex pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
                        <button onclick="changeTab('carte')" class="flex-1 flex flex-col items-center py-3 gap-1 ${currentTab === 'carte' ? 'text-purple-600 font-bold' : 'text-gray-400'}">
                            <i data-lucide="map" class="w-6 h-6"></i>
                            <span class="text-[10px] uppercase tracking-wider">Carte</span>
                        </button>
                        <button onclick="changeTab('defi_mois')" class="flex-1 flex flex-col items-center py-3 gap-1 ${currentTab === 'defi_mois' ? 'text-purple-600 font-bold' : 'text-gray-400'}">
                            <i data-lucide="sparkles" class="w-6 h-6"></i>
                            <span class="text-[10px] uppercase tracking-wider">Climby</span>
                        </button>
                        <button onclick="changeTab('classement')" class="flex-1 flex flex-col items-center py-3 gap-1 ${currentTab === 'classement' ? 'text-purple-600 font-bold' : 'text-gray-400'}">
                            <i data-lucide="medal" class="w-6 h-6"></i>
                            <span class="text-[10px] uppercase tracking-wider">Classement</span>
                        </button>
                    </nav>
                `;

                if (selectedAtelierId) {
                    const atelier = ATELIERS.find(a => a.id === selectedAtelierId);
                    const atelierScore = atelier.defis.reduce((acc, curr) => acc + (completedDefis[curr.id] ? curr.points : 0), 0);
                    const maxScore = atelier.defis.reduce((acc, curr) => acc + curr.points, 0);

                    html += `
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end md:justify-center md:items-center">
                            <div class="bg-gray-50 text-gray-800 w-full md:w-[450px] md:rounded-3xl rounded-t-3xl min-h-[60vh] md:min-h-0 flex flex-col overflow-hidden shadow-2xl modal-animate">
                                <div class="relative h-40 w-full">
                                    ${atelier.preview}
                                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                                    <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/40 backdrop-blur-md text-white p-2 rounded-full hover:bg-black/60 transition">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                    <h2 class="absolute bottom-4 left-6 text-white text-3xl font-black drop-shadow-md">${atelier.name}</h2>
                                </div>
                                
                                <div class="p-6 space-y-3 flex-1 overflow-y-auto max-h-[50vh]">
                                    <p class="text-gray-500 font-medium mb-4">Coche les défis que tu as validés pour gagner des points !</p>
                                    ${atelier.defis.map(defi => {
                                        const isDone = completedDefis[defi.id];
                                        return `
                                            <button onclick="toggleDefi('${defi.id}')" class="w-full flex items-center p-4 rounded-2xl border-2 text-left transition-all active:scale-[0.98] ${isDone ? 'border-teal-500 bg-teal-50' : 'border-gray-200 bg-white hover:border-purple-200 hover:bg-purple-50'}">
                                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 flex-shrink-0 transition-colors ${isDone ? 'bg-teal-500 border-teal-500 text-white' : 'border-gray-300 bg-gray-50'}">
                                                    ${isDone ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ''}
                                                </div>
                                                <div class="flex-1"><p class="font-bold leading-tight ${isDone ? 'text-teal-900' : 'text-gray-700'}">${defi.text}</p></div>
                                                <div class="font-black text-lg ml-3 ${isDone ? 'text-teal-600' : 'text-purple-600'}">+${defi.points}</div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                
                                <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center pb-safe">
                                    <div class="text-gray-500 font-bold">Total sur cet atelier</div>
                                    <div class="text-2xl font-black text-purple-600">${atelierScore} <span class="text-sm text-gray-400 font-bold ml-1">/ ${maxScore}</span></div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
                app.innerHTML = html;
            }

            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
