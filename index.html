    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spookyFade {
            0% { opacity: 0; transform: scale(0.95); filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(40deg); }
            100% { opacity: 1; transform: scale(1); filter: hue-rotate(0deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .modal-animate {
            animation: slideUp 0.3s ease-out forwards;
        }
        .halloween-transition {
            animation: spookyFade 0.5s ease-out forwards;
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .challenge-color-option input:checked + span {
            outline: 3px solid #334155;
            outline-offset: 3px;
            transform: scale(1.12);
        }
        .challenge-color-option input:focus-visible + span {
            box-shadow: 0 0 0 3px white, 0 0 0 5px #64748b;
        }

        async function compressWorkshopImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                throw new Error("Choisis un fichier image valide.");
            }
            if (file.size > 20 * 1024 * 1024) {
                throw new Error("L'image d'origine doit faire moins de 20 Mo.");
            }
            const bitmap = await createImageBitmap(file);
            try {
                for (const maxDimension of [800, 640, 480, 360]) {
                    const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
                    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
                    const context = canvas.getContext('2d');
                    if (!context) throw new Error("Le navigateur ne peut pas compresser cette image.");
                    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                    for (const quality of [0.72, 0.56, 0.4]) {
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                        if (!blob) throw new Error("La compression de l'image a échoué.");
                        if (blob.size > 200000) continue;
                        const dataUrl = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => reject(new Error("La lecture de l'image compressée a échoué."));
                            reader.readAsDataURL(blob);
                        });
                        return dataUrl;
                    }
                }
            } finally {
                bitmap.close();
            }
            throw new Error("Cette image reste trop volumineuse après compression. Essaie une image plus petite.");
        }

                            throw new Error("La récompense cadeau doit contenir entre 1 et 80 caractères.");
                        }
                        if (!['points', 'gift'].includes(rewardType) || !Object.prototype.hasOwnProperty.call(CHALLENGE_COLORS, color)) {
                            throw new Error("Choisis un type de récompense et une couleur valides.");
                        }
                        return { id: defi.id, text, points: rewardType === 'gift' ? 0 : points, color, rewardType, rewardText };
                    })
                };
                if (!updated[workshop.id].defis.length || updated[workshop.id].defis.length > 10) {
                    throw new Error("Un atelier doit comporter entre 1 et 10 défis.");
                }
                await savePublicConfiguration({ workshops: updated });
                adminMessage = "L'atelier et ses défis ont été mis à jour.";
                adminError = '';
            } catch (error) {
                console.error("Enregistrement de l'atelier impossible :", error);
                adminError = error.message || "Enregistrement de l'atelier impossible.";

        window.addAdminEventChallenge = function(level) {
            if (!LEVEL_KEYS.includes(level) || !adminEventDraft) return;
            if (adminEventDraft.levels[level].length >= 30) {
                adminError = "Limite de 30 énigmes par niveau atteinte.";

            syncAdminEventDraftFromForm();
            adminEventDraft.levels[level].push({ atelierId: ATELIERS[0].id, answer: 0 });

        window.removeAdminEventChallenge = function(level, index) {
            if (!LEVEL_KEYS.includes(level) || !adminEventDraft) return;
            syncAdminEventDraftFromForm();
            adminEventDraft.levels[level].splice(index, 1);
            render();
        };

        function syncAdminEventDraftFromForm() {
            const titleInput = document.querySelector('[name="eventTitle"]');
            const descriptionInput = document.querySelector('[name="eventDescription"]');
            if (titleInput) adminEventDraft.title = titleInput.value;
            if (descriptionInput) adminEventDraft.description = descriptionInput.value;
            LEVEL_KEYS.forEach(level => {
                adminEventDraft.levels[level] = adminEventDraft.levels[level].map((entry, index) => {
                    const atelierInput = document.querySelector(`[name="atelier_${level}_${index}"]`);
                    const answerInput = document.querySelector(`[name="answer_${level}_${index}"]`);
                    return {
                        atelierId: atelierInput ? atelierInput.value : entry.atelierId,
                        answer: answerInput ? Number(answerInput.value) : entry.answer
                    };
                });
            });
        }

        window.saveAdminEvent = async function(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const formData = new FormData(form);
            syncAdminEventDraftFromForm();
            const title = String(formData.get('eventTitle')).trim();
            const description = String(formData.get('eventDescription')).trim();
            adminEventDraft.title = title;
            adminEventDraft.description = description;
            if (!title || title.length > 100 || description.length > 300) {
                adminError = "Le titre (1 à 100 caractères) et la description (300 caractères maximum) sont requis.";
                render();
                return;
            }
            const levels = {};
            for (const level of LEVEL_KEYS) {
                const existingEntries = adminEventDraft.levels[level];
                levels[level] = [];
                const seenWorkshops = new Set();
                for (let index = 0; index < existingEntries.length; index += 1) {
                    const atelierId = String(formData.get(`atelier_${level}_${index}`));
                    const answer = Number(formData.get(`answer_${level}_${index}`));
                    if (!ATELIERS.some(atelier => atelier.id === atelierId) || !Number.isFinite(answer)) {
                        adminError = "Chaque énigme doit être associée à un atelier et à une réponse numérique.";
                        render();
                        return;
                    }
                    if (seenWorkshops.has(atelierId)) {
                        adminError = "Un même atelier ne peut apparaître qu'une fois par niveau.";
                        render();
                        return;
                    }
                    seenWorkshops.add(atelierId);
                    levels[level].push({ atelierId, answer });
                }
            }
            try {
                const events = {
                    ...appSettings.events,
                    [adminSelectedSeason]: { title, description, levels }
                };
                await savePublicConfiguration({ events });
                adminMessage = `Le défi ${EVENT_INFO[adminSelectedSeason].label} a été publié.`;
                adminError = '';
            } catch (error) {
                console.error("Enregistrement du défi saisonnier impossible :", error);
                adminError = "Enregistrement impossible. Vérifie les règles Firestore admin.";
                adminMessage = '';
            }
            render();
        };

        // --- CALCUL DES SCORES VIA TIMESTAMP ---
        function getStartOfDay() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        }
        function getStartOfWeek() {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(now.getFullYear(), now.getMonth(), diff, 0, 0, 0).getTime();
        }
        function getStartOfMonth() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        }
        function calculateUserScores(defis) {
            let total = 0, daily = 0, weekly = 0, monthly = 0;
            const startOfDay = getStartOfDay();
            const startOfWeek = getStartOfWeek();
            const startOfMonth = getStartOfMonth();

            if (!defis) return { total: 0, daily: 0, weekly: 0, monthly: 0 };

            ATELIERS.forEach(atelier => {
                atelier.defis.forEach(defi => {
                    const timestamp = defis[defi.id];
                    if (timestamp) {
                        const points = defi.rewardType === 'gift' ? 0 : defi.points;
                        total += points;
                        if (timestamp >= startOfDay) daily += points;
                        if (timestamp >= startOfWeek) weekly += points;
                        if (timestamp >= startOfMonth) monthly += points;
                    }
                });
            });
            return { total, daily, weekly, monthly };
        }

            saveHalloweenProgress();

        window.handleHalloweenInput = (atelierId, val) => {
            halloweenInputs[atelierId] = val;
            if (halloweenStatus[atelierId]) delete halloweenStatus[atelierId];
            saveHalloweenProgress();
            const btn = document.getElementById('verifyBtn');
            if (btn) {
                if (areAllFilled()) {
                    btn.disabled = false;
                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-orange-600 text-white shadow-orange-900/50 hover:bg-orange-500 cursor-pointer active:scale-95";

                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-slate-800 text-slate-500 cursor-not-allowed opacity-60";
                }
            }
        };

        function getActiveAteliersForLevel() {
            const activeEntries = getCurrentEventEntries();
            return ATELIERS.filter(atelier => activeEntries.some(entry => entry.atelierId === atelier.id));
        }

        function areAllFilled() {
            const currentAteliers = getActiveAteliersForLevel();
            if (currentAteliers.length === 0) return false;
            return currentAteliers.every(a => {
                const val = halloweenInputs[a.id];
                return val !== undefined && val !== '' && val !== null && String(val).trim() !== '';
            });
        }

        window.verifyHalloweenAnswers = function() {
            const entries = getCurrentEventEntries();
            halloweenStatus = {};

            entries.forEach(entry => {
                if (Number(halloweenInputs[entry.atelierId]) === entry.answer) {
                    halloweenStatus[entry.atelierId] = 'correct';
                } else {
                    halloweenStatus[entry.atelierId] = 'error';
                }
            });
            halloweenSubmitted = true;
            saveHalloweenProgress();
            render();
        };

        function isCurrentEventCompleted() {
            const entries = getCurrentEventEntries();
            if (!halloweenLevel || !halloweenSubmitted || entries.length === 0) return false;
            return entries.every(entry => Number(halloweenInputs[entry.atelierId]) === entry.answer);

                        </div>
                    </div>

            } else {
                const myScores = calculateUserScores(completedDefis);
                const totalScore = myScores.total; 
                
                const themeStyles = {
                    classic: { page: 'bg-gray-50 text-gray-800', header: 'bg-white shadow-sm', logo: 'bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-teal-500', badge: 'bg-purple-100 border border-purple-200 text-purple-700', icon: 'trophy', accent: 'text-purple-600' },

                                <div class="text-right hidden md:block">

                                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                                    ${LEVEL_KEYS.map((level, index) => {
                                        const colors = ['emerald', 'amber', 'red'];
                                        const color = colors[index];
                                        const disabled = eventConfig.levels[level].length === 0;

                                    }).join('')}
                                </div>
                            </div>

                    } else if (isCurrentEventCompleted()) {
                        html += `
                            <div class="p-6 flex flex-col items-center justify-center text-center py-16 halloween-transition">
                                <div class="w-32 h-32 bg-orange-600 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(234,88,12,0.8)] mb-6 animate-bounce">

                                </div>
                                <h1 class="text-4xl font-black text-orange-400 mb-4">🏆 ${escapeHtml(eventConfig.title)} (${halloweenLevel.toUpperCase()}) ! ${activeEventInfo.emoji}</h1>

                                <div class="bg-slate-900 border-2 border-orange-500/50 p-6 rounded-3xl shadow-xl max-w-md w-full mb-8">

                                <div class="bg-gradient-to-r from-orange-900/60 to-purple-950/60 border border-orange-500/30 rounded-3xl p-6 mb-6 text-center shadow-lg">
                                    <h2 class="text-2xl font-black text-orange-400 mb-2">${activeEventInfo.emoji} ${escapeHtml(eventConfig.title)} (${halloweenLevel})</h2>
                                    <p class="text-slate-300 text-sm">${escapeHtml(eventConfig.description)}</p>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
                        `;

                        currentAteliers.forEach(atelier => {
                            const val = halloweenInputs[atelier.id] !== undefined ? halloweenInputs[atelier.id] : '';

                            let borderClass = 'border-slate-800';

                            if (status === 'correct') { borderClass = 'border-emerald-500 bg-emerald-950/20'; }

                                    </div>
                                </div>
                            `;
                        });

                        html += `

                                <div class="flex justify-center pb-8">

                    let usersList = [...allUsersData];
                    if (isLogged) {
                        const myIndex = usersList.findIndex(u => u.id === userId);
                        if (myIndex >= 0) {
                            usersList[myIndex].completedDefis = completedDefis;
                            usersList[myIndex].pseudo = pseudo;
                        } else {
                            usersList.push({ id: userId, pseudo: pseudo, completedDefis: completedDefis });
                        }
                    }

                    // SÉCURITÉ AJOUTÉE ICI : "u.pseudo || 'Anonyme'" empêche tout undefined
                    const usersScores = usersList.map(u => {
                        const scores = calculateUserScores(u.completedDefis || {});
                        return { 
                            pseudo: u.pseudo || 'Anonyme', 
                            daily: scores.daily, 
                            weekly: scores.weekly, 
                            monthly: scores.monthly,
                            isCurrent: u.id === userId 
                        };
                    });

                    const dbJour = usersScores.filter(u => u.daily > 0).sort((a,b) => b.daily - a.daily).map((u, i) => ({...u, rank: i+1, score: u.daily}));
                    const dbSemaine = usersScores.filter(u => u.weekly > 0).sort((a,b) => b.weekly - a.weekly).map((u, i) => ({...u, rank: i+1, score: u.weekly}));
                    const dbMois = usersScores.filter(u => u.monthly > 0).sort((a,b) => b.monthly - a.monthly).map((u, i) => ({...u, rank: i+1, score: u.monthly}));

                    const buildTable = (data, title, subtitle, bgColor) => `

                                        <div class="flex-1 font-bold ${p.isCurrent ? 'text-purple-700' : 'text-gray-700'}">
                                            ${p.pseudo} ${p.isCurrent ? `<span class="ml-2 text-xs bg-purple-200 text-purple-700 px-2 py-0.5 rounded-full uppercase">Toi</span>` : ''}

                            <div class="${leaderboardTab !== 'semaine' ? 'hidden lg:block' : ''}">${buildTable(dbSemaine, "Top de la Semaine", "Réinitialisation lundi à minuit", "bg-gradient-to-r from-teal-500 to-teal-400")}</div>
                            <div class="${leaderboardTab !== 'mois' ? 'hidden lg:block' : ''}">${buildTable(dbMois, "Top du Mois", "Réinitialisation le 1er du mois", "bg-gradient-to-r from-orange-500 to-orange-400")}</div>

                        <button onclick="changeTab('carte')" class="flex-1 flex flex-col items-center py-3 gap-1 ${currentTab === 'carte' ? (isHalloween ? 'text-orange-400' : 'text-purple-600') : 'text-gray-400'}">

                        ${challengeAvailable ? `<button onclick="changeTab('defi_mois')" class="flex-1 flex flex-col items-center py-3 gap-1 ${currentTab === 'defi_mois' ? (isHalloween ? 'text-orange-400 font-black' : 'text-purple-600') : 'text-gray-400'}">

                    const atelierScore = pointDefis.reduce((acc, curr) => acc + (completedDefis[curr.id] ? curr.points : 0), 0);
                    const maxScore = pointDefis.reduce((acc, curr) => acc + curr.points, 0);

                    html += `
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end md:justify-center md:items-center">

                                <div class="relative h-40 w-full">
                                    ${getAtelierPreview(atelier)}
                                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                                    <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/40 backdrop-blur-md text-white p-2 rounded-full hover:bg-black/60 transition">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                    <h2 class="absolute bottom-4 left-6 text-white text-3xl font-black drop-shadow-md">${escapeHtml(atelier.name)}</h2>
                                </div>
                                
                                <div class="p-6 space-y-3 flex-1 overflow-y-auto max-h-[50vh]">
                                    <p class="text-gray-500 font-medium mb-4">Valide les défis pour obtenir les points ou cadeaux indiqués.</p>
                                    ${atelier.defis.map(defi => {
                                        const isDone = completedDefis[defi.id];
                                        const color = getChallengeColor(defi);
                                        return `
                                            <button onclick="toggleDefi('${defi.id}')" class="w-full flex items-center p-4 rounded-2xl border-2 text-left transition-all ${color.card} ${isDone ? 'shadow-sm' : 'opacity-85 hover:opacity-100'}">
                                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 flex-shrink-0 transition-colors ${isDone ? `${color.completed} border-white text-white` : 'border-current/30 bg-white/70'}">
                                                    ${isDone ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ''}
                                                </div>
                                                <div class="flex-1"><p class="font-bold leading-tight">${escapeHtml(defi.text)}</p></div>
                                                <div class="ml-3 rounded-full px-3 py-1 text-xs font-black ${color.reward}">${defi.rewardType === 'gift' ? escapeHtml(getChallengeRewardLabel(defi)) : `+${defi.points} pts`}</div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                
                                <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center pb-safe">
                                    <div>
                                        <div class="text-gray-500 font-bold">Points sur cet atelier</div>
                                        ${atelier.defis.some(defi => defi.rewardType === 'gift') ? '<div class="mt-1 text-xs font-medium text-gray-500">Les cadeaux sont indiqués sur chaque défi.</div>' : ''}
                                    </div>
                                    <div class="text-right font-black text-purple-600">${maxScore ? `<span class="text-2xl">${atelierScore}</span> <span class="text-sm text-gray-400 font-bold ml-1">/ ${maxScore} pts</span>` : '<span class="text-sm text-gray-500">Cadeaux uniquement</span>'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
                app.innerHTML = html;
            }

            if (window.lucide) { lucide.createIcons(); }
        }

        // --- CYCLE DE VIE (INIT & ÉCOUTE FIREBASE) ---
        async function initApp() {
            render(); 
            
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsersData = [];
                snapshot.forEach((userDoc) => {
                    allUsersData.push({ id: userDoc.id, ...userDoc.data() });
                });
                if (currentTab === 'classement' || currentTab === 'admin') render();
            }, (error) => {
                console.error("Écoute des profils Firebase échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "Les profils et statistiques ne sont pas accessibles. Vérifie les règles Firestore.";
                    render();
                }
            });

            onSnapshot(collection(db, "workshopImages"), (snapshot) => {
                const nextImages = {};
                snapshot.forEach(imageDoc => {
                    const imageDataUrl = imageDoc.data().imageDataUrl;
                    if (typeof imageDataUrl === 'string'
                        && imageDataUrl.length <= 300000
                        && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(imageDataUrl)) {
                        nextImages[imageDoc.id] = imageDataUrl;
                    }
                });
                workshopImages = nextImages;
                if (currentTab === 'carte' || currentTab === 'admin' || selectedAtelierId) render();
            }, error => {
                console.error("Lecture des miniatures d'ateliers échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "Les miniatures d'ateliers ne sont pas accessibles. Vérifie les règles Firestore.";
                    render();
                }
            });

            onSnapshot(doc(db, "appConfig", "main"), (snapshot) => {
                if (snapshot.exists()) applyAppConfiguration(snapshot.data());
                if (currentTab !== 'admin' || snapshot.exists()) render();
            }, (error) => {
                console.error("Lecture de la configuration de l'application échouée :", error);
                appConfigError = "La configuration partagée n'a pas pu être lue. Vérifie les règles Firestore.";
                if (currentTab === 'admin') render();
            });

            onAuthStateChanged(auth, async user => {
                adminUser = user;
                adminAuthorized = false;
                if (user) {
                    try {
                        const token = await user.getIdTokenResult(true);
                        adminAuthorized = token.claims.admin === true;
                        if (!adminAuthorized && currentTab === 'admin') {
                            adminError = "Ce compte Firebase ne possède pas le rôle administrateur.";
                        }
                    } catch (error) {
                        console.error("Vérification du rôle admin échouée :", error);
                        adminError = "Impossible de vérifier les droits administrateur.";
                    }
                }
                if (currentTab === 'admin') render();
            }, error => {
                console.error("Écoute de la session Firebase échouée :", error);
                if (currentTab === 'admin') {
                    adminError = "La session administrateur n'a pas pu être vérifiée.";
                    render();
                }
            });
        }

        initApp();
    </script>
</body>
</html>
