    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spookyFade {
            0% { opacity: 0; transform: scale(0.95); filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(40deg); }
            100% { opacity: 1; transform: scale(1); filter: hue-rotate(0deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .modal-animate {
            animation: slideUp 0.3s ease-out forwards;
        }
        .halloween-transition {
            animation: spookyFade 0.5s ease-out forwards;
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>

        };

        let isLogged = !!pseudo;
        
        let userId = localStorage.getItem('climbup_userid');

        }

        let completedDefis = JSON.parse(localStorage.getItem('climbup_defis') || '{}');
        const halloweenStorageKey = `climbup_halloween_progress_${userId}`;

        function loadHalloweenProgress() {
            const storedProgress = localStorage.getItem(halloweenStorageKey);
            if (!storedProgress) return { activeLevel: null, levels: {} };

            try {
                const parsed = JSON.parse(storedProgress);
                const levels = parsed && parsed.levels && typeof parsed.levels === 'object' ? parsed.levels : {};
                Object.keys(levels).forEach(level => {
                    if (!Object.prototype.hasOwnProperty.call(DIFF_GROUPES, level)) {
                        delete levels[level];
                        return;
                    }
                    const progress = levels[level];
                    if (!progress || typeof progress !== 'object') {
                        delete levels[level];
                        return;
                    }
                    progress.inputs = progress.inputs && typeof progress.inputs === 'object' ? progress.inputs : {};
                    progress.status = progress.status && typeof progress.status === 'object' ? progress.status : {};
                    progress.submitted = !!progress.submitted;
                });
                return {
                    activeLevel: Object.prototype.hasOwnProperty.call(DIFF_GROUPES, parsed.activeLevel) ? parsed.activeLevel : null,
                    levels
                };
            } catch (error) {
                console.warn("Progression Halloween enregistrée illisible :", error);
                return { activeLevel: null, levels: {} };
            }
        }

        const savedHalloweenProgress = loadHalloweenProgress();

        let halloweenStatus = halloweenLevel && halloweenProgressByLevel[halloweenLevel] ? halloweenProgressByLevel[halloweenLevel].status : {};

        function saveHalloweenProgress() {
            if (halloweenLevel) {
                halloweenProgressByLevel[halloweenLevel] = {
                    inputs: halloweenInputs,
                    status: halloweenStatus,
                    submitted: halloweenSubmitted

            }));

        // --- CALCUL DES SCORES VIA TIMESTAMP ---
        function getStartOfDay() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        }
        function getStartOfWeek() {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(now.getFullYear(), now.getMonth(), diff, 0, 0, 0).getTime();
        }
        function getStartOfMonth() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        }
        function calculateUserScores(defis) {
            let total = 0, daily = 0, weekly = 0, monthly = 0;
            const startOfDay = getStartOfDay();
            const startOfWeek = getStartOfWeek();
            const startOfMonth = getStartOfMonth();

            if (!defis) return { total: 0, daily: 0, weekly: 0, monthly: 0 };

            ATELIERS.forEach(atelier => {
                atelier.defis.forEach(defi => {
                    const timestamp = defis[defi.id];
                    if (timestamp) {
                        total += defi.points;
                        if (timestamp >= startOfDay) daily += defi.points;
                        if (timestamp >= startOfWeek) weekly += defi.points;
                        if (timestamp >= startOfMonth) monthly += defi.points;
                    }
                });
            });
            return { total, daily, weekly, monthly };
        }

                                <div class="p-6 space-y-3 flex-1 overflow-y-auto max-h-[50vh]">
                                    <p class="text-gray-500 font-medium mb-4">Coche les défis que tu as validés pour gagner des points !</p>
                                    ${atelier.defis.map(defi => {
                                        const isDone = completedDefis[defi.id];
                                        return `
                                            <button onclick="toggleDefi('${defi.id}')" class="w-full flex items-center p-4 rounded-2xl border-2 text-left transition-all ${isDone ? 'border-teal-500 bg-teal-50' : 'border-gray-200 bg-white hover:border-purple-200 hover:bg-purple-50'}">
                                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 flex-shrink-0 transition-colors ${isDone ? 'bg-teal-500 border-teal-500 text-white' : 'border-gray-300 bg-gray-50'}">
                                                    ${isDone ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ''}
                                                </div>
                                                <div class="flex-1"><p class="font-bold leading-tight ${isDone ? 'text-teal-900' : 'text-gray-700'}">${defi.text}</p></div>
                                                <div class="font-black text-lg ml-3 ${isDone ? 'text-teal-600' : 'text-purple-600'}">+${defi.points}</div>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                
                                <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center pb-safe">
                                    <div class="text-gray-500 font-bold">Total sur cet atelier</div>
                                    <div class="text-2xl font-black text-purple-600">${atelierScore} <span class="text-sm text-gray-400 font-bold ml-1">/ ${maxScore}</span></div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
                app.innerHTML = html;
            }

            if (window.lucide) { lucide.createIcons(); }
        }

        // --- CYCLE DE VIE (INIT & ÉCOUTE FIREBASE) ---
        async function initApp() {
            render(); 
            
            try {
                onSnapshot(collection(db, "users"), (snapshot) => {
                    allUsersData = [];
                    snapshot.forEach((doc) => {
                        allUsersData.push({ id: doc.id, ...doc.data() });
                    });
                    if (currentTab === 'classement') {
                        render();
                    }
                }, (error) => {
                    console.warn("Écoute Firebase échouée :", error);
                });
            } catch (e) {}
        }

        initApp();
    </script>
</body>
</html>
