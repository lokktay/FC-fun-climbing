<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climb Up - Défis</title>

    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes rewardReveal {
            0% { opacity: 0; transform: translateY(28px) scale(.82) rotate(-2deg); }
            65% { opacity: 1; transform: translateY(-4px) scale(1.025) rotate(1deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        @keyframes themeEnter {
            from { opacity: 0; transform: translate3d(0, 10px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .modal-animate {
            animation: slideUp 0.3s ease-out forwards;
        }
        .reward-reveal {
            animation: rewardReveal .7s cubic-bezier(.16, 1, .3, 1) both;
        }
        .halloween-transition {
            animation: themeEnter 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .challenge-color-option input:checked + span {
            outline: 3px solid #334155;
            outline-offset: 3px;
            transform: scale(1.12);
        }
        .challenge-color-option input:focus-visible + span {
            box-shadow: 0 0 0 3px white, 0 0 0 5px #64748b;
        }
        .app-shell {
            isolation: isolate;
            background-image: radial-gradient(ellipse at 10% 0%, rgba(124, 58, 237, 0.08), transparent 34%), radial-gradient(ellipse at 95% 35%, rgba(20, 184, 166, 0.08), transparent 32%);
        }
        .theme-christmas {
            background-image: radial-gradient(ellipse at 0% 0%, rgba(239, 68, 68, 0.09), transparent 35%), radial-gradient(ellipse at 100% 30%, rgba(16, 185, 129, 0.1), transparent 35%);
        }
        .theme-halloween {
            background-image: radial-gradient(ellipse at 88% 8%, rgba(249, 115, 22, 0.28), transparent 31%), radial-gradient(ellipse at 6% 40%, rgba(147, 51, 234, 0.2), transparent 34%), linear-gradient(165deg, #090715 0%, #171022 48%, #100b1b 100%);
            background-size: 140% 140%;
        }
        .theme-easter {
            background-image: radial-gradient(ellipse at 0% 0%, rgba(192, 132, 252, 0.12), transparent 36%), radial-gradient(ellipse at 100% 30%, rgba(244, 114, 182, 0.1), transparent 34%);
        }
        .seasonal-decor {
            position: absolute;
            inset: 13rem 0 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .seasonal-decor > * { pointer-events: none; }
        .app-header { position: sticky; top: 0; z-index: 30; }
        .app-main { position: relative; z-index: 10; }
        .app-desktop-nav {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .75rem;
            padding: 1.25rem 1rem;
        }
        .app-desktop-nav button { flex: 0 0 auto; white-space: nowrap; }
        .app-mobile-nav {
            min-height: 4.25rem;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .app-mobile-nav button { min-width: 0; }
        .app-mobile-nav span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .map-intro-panel {
            position: relative;
            z-index: 10;
            isolation: isolate;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, .94);
            padding: 1.25rem;
            box-shadow: 0 12px 30px rgba(30, 41, 59, .08);
        }
        .theme-halloween .map-intro-panel {
            border-color: rgba(251, 146, 60, .24);
            background: rgba(15, 12, 27, .96);
            box-shadow: 0 12px 34px rgba(0, 0, 0, .28);
        }
        .seasonal-ornament {
            position: absolute;
            opacity: 0.9;
            filter: drop-shadow(0 8px 14px rgba(15, 23, 42, 0.28));
            transform-origin: center;
            animation: ornamentDrift 9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .seasonal-ornament:nth-child(2n) { animation-delay: -3s; }
        .seasonal-ornament:nth-child(3n) { animation-delay: -6s; }
        .theme-christmas .seasonal-ornament,
        .theme-easter .seasonal-ornament { opacity: 0.82; }
        .theme-halloween .seasonal-ornament { opacity: 1; }
        .seasonal-snow {
            position: absolute;
            inset: 0;
            opacity: 0.7;
            background-image: radial-gradient(3px 3px at 12% 18%, white 98%, transparent), radial-gradient(4px 4px at 78% 12%, white 98%, transparent), radial-gradient(2px 2px at 91% 48%, white 98%, transparent), radial-gradient(4px 4px at 31% 61%, white 98%, transparent), radial-gradient(3px 3px at 66% 76%, white 98%, transparent), radial-gradient(2px 2px at 8% 89%, white 98%, transparent);
            background-size: 260px 280px;
            animation: snowDrift 24s linear infinite;
        }
        .halloween-moon {
            position: absolute;
            top: 8rem;
            right: max(8%, calc((100% - 1120px) / 2));
            width: clamp(110px, 18vw, 220px);
            aspect-ratio: 1;
            border-radius: 9999px;
            background: radial-gradient(circle at 35% 32%, #fff2c2 0%, #ffbd52 42%, #f97316 73%, #b93811 100%);
            box-shadow: 0 0 45px rgba(249, 115, 22, 0.45), 0 0 120px rgba(249, 115, 22, 0.18);
            opacity: 0.76;
            animation: moonPulse 8s ease-in-out infinite;
        }
        .halloween-moon::before,
        .halloween-moon::after {
            content: "";
            position: absolute;
            top: 38%;
            width: 9%;
            height: 13%;
            border-radius: 50%;
            background: #422006;
        }
        .halloween-moon::before { left: 31%; }
        .halloween-moon::after { right: 31%; }
        .halloween-moon-face {
            position: absolute;
            left: 39%;
            top: 58%;
            width: 22%;
            height: 12%;
            border-bottom: 4px solid #422006;
            border-radius: 0 0 50% 50%;
        }
        .haunted-silhouette {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: clamp(100px, 18vw, 210px);
            color: #080611;
            opacity: 0.88;
        }
        .christmas-lights {
            position: absolute;
            top: 5.2rem;
            left: 0;
            width: 100%;
            height: 28px;
            border-top: 3px solid rgba(30, 41, 59, .25);
            background: radial-gradient(circle, #ef4444 0 4px, transparent 5px) 2px 8px / 56px 26px repeat-x,
                radial-gradient(circle, #16a34a 0 4px, transparent 5px) 28px 12px / 56px 26px repeat-x,
                radial-gradient(circle, #facc15 0 4px, transparent 5px) 14px 18px / 56px 26px repeat-x;
            filter: drop-shadow(0 3px 8px rgba(234, 179, 8, .35));
        }
        .easter-egg {
            position: absolute;
            width: 34px;
            height: 46px;
            border-radius: 50% 50% 45% 45%;
            border: 3px solid rgba(255,255,255,.8);
            box-shadow: 0 8px 18px rgba(76,29,149,.18);
            animation: ornamentDrift 8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .map-watermark {
            position: absolute;
            z-index: 0;
            width: min(68vw, 520px);
            aspect-ratio: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            opacity: 0.16;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .theme-christmas .map-watermark { opacity: 0.13; }
        .theme-easter .map-watermark { opacity: 0.13; }
        .map-workshop-card {
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 10px 24px rgba(30, 41, 59, 0.14);
        }
        .theme-classic .map-workshop-card:hover,
        .theme-christmas .map-workshop-card:hover,
        .theme-easter .map-workshop-card:hover {
            box-shadow: 0 16px 30px rgba(76, 29, 149, 0.2);
            transform: translateY(-3px);
        }
        @keyframes ornamentDrift {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-3deg) scale(1); }
            50% { transform: translate3d(0, -14px, 0) rotate(3deg) scale(1.035); }
        }
        @keyframes snowDrift {
            from { background-position: 0 -280px, 0 -280px; }
            to { background-position: 40px 0, -30px 0; }
        }
        @keyframes moonPulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }

        }

        }
    </style>
</head>

        function normalizeAppSettings(rawSettings) {

                    if (!workshop || typeof workshop !== 'object') return;

                monthlyRewardsEnabled: typeof raw.monthlyRewardsEnabled === 'boolean' ? raw.monthlyRewardsEnabled : DEFAULT_APP_SETTINGS.monthlyRewardsEnabled,
                monthlyRewards: [],
                workshopIds: ATELIERS.map(atelier => atelier.id),
                workshops: {},
                events: {}
            };

            const usedRewardIds = new Set();
            if (Array.isArray(raw.monthlyRewards)) {
                raw.monthlyRewards.slice(0, 20).forEach(reward => {
                    if (!reward || typeof reward.id !== 'string' || !/^[a-zA-Z0-9_-]{1,80}$/.test(reward.id)
                        || usedRewardIds.has(reward.id) || !Number.isInteger(Number(reward.points))
                        || Number(reward.points) < 1 || Number(reward.points) > 100000
                        || typeof reward.title !== 'string' || !reward.title.trim()) return;
                    usedRewardIds.add(reward.id);
                    settings.monthlyRewards.push({
                        id: reward.id,
                        points: Number(reward.points),
                        title: reward.title.trim().slice(0, 80),
                        description: typeof reward.description === 'string' ? reward.description.trim().slice(0, 240) : ''
                    });
                });
            }

            const usedDefiIds = new Set();
            ATELIERS.forEach(atelier => {
                const custom = raw.workshops && raw.workshops[atelier.id];
                if (!custom || typeof custom !== 'object') {
                    atelier.defis.forEach(defi => usedDefiIds.add(defi.id));
                    return;

                if (typeof custom.name === 'string' && custom.name.trim()) {
                    atelier.name = custom.name.trim().slice(0, 80);

                        const rewardType = customDefi.rewardType === 'gift' ? 'gift' : 'points';

            try {
                const parsed = JSON.parse(storedProgress);
                const levels = parsed && parsed.levels && typeof parsed.levels === 'object' ? parsed.levels : {};
                Object.keys(levels).forEach(level => {
                    if (!LEVEL_KEYS.includes(level)) {
                        delete levels[level];
                        return;
                    }
                    const progress = levels[level];
                    if (!progress || typeof progress !== 'object') {
                        delete levels[level];
                        return;
                    }
                    progress.inputs = progress.inputs && typeof progress.inputs === 'object' ? progress.inputs : {};
                    progress.status = progress.status && typeof progress.status === 'object' ? progress.status : {};
                    progress.submitted = !!progress.submitted;
                });
                return {
                    activeLevel: LEVEL_KEYS.includes(parsed.activeLevel) ? parsed.activeLevel : null,

                console.warn("Progression Halloween enregistrée illisible :", error);

        async function compressWorkshopImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                throw new Error("Choisis un fichier image valide.");
            }
            if (file.size > 20 * 1024 * 1024) {
                throw new Error("L'image d'origine doit faire moins de 20 Mo.");
            }
            const bitmap = await createImageBitmap(file);
            try {
                for (const maxDimension of [800, 640, 480, 360]) {
                    const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
                    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
                    const context = canvas.getContext('2d');
                    if (!context) throw new Error("Le navigateur ne peut pas compresser cette image.");
                    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                    for (const quality of [0.72, 0.56, 0.4]) {
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                        if (!blob) throw new Error("La compression de l'image a échoué.");
                        if (blob.size > 200000) continue;
                        const dataUrl = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => reject(new Error("La lecture de l'image compressée a échoué."));
                            reader.readAsDataURL(blob);
                        });
                        return dataUrl;
                    }
                }
            } finally {
                bitmap.close();
            }
            throw new Error("Cette image reste trop volumineuse après compression. Essaie une image plus petite.");
        }

        window.saveAdminEvent = async function(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const formData = new FormData(form);
            syncAdminEventDraftFromForm();
            const title = String(formData.get('eventTitle')).trim();
            const description = String(formData.get('eventDescription')).trim();
            adminEventDraft.title = title;

            if (!title || title.length > 100 || description.length > 300) {
                adminError = "Le titre (1 à 100 caractères) et la description (300 caractères maximum) sont requis.";
                render();
                return;
            }
            const levels = {};
            for (const level of LEVEL_KEYS) {
                const existingEntries = adminEventDraft.levels[level];
                levels[level] = [];
                const seenWorkshops = new Set();
                for (let index = 0; index < existingEntries.length; index += 1) {
                    const atelierId = String(formData.get(`atelier_${level}_${index}`));
                    const answer = Number(formData.get(`answer_${level}_${index}`));
                    if (!ATELIERS.some(atelier => atelier.id === atelierId) || !Number.isFinite(answer)) {
                        adminError = "Chaque énigme doit être associée à un atelier et à une réponse numérique.";
                        render();
                        return;

                    if (seenWorkshops.has(atelierId)) {
                        adminError = "Un même atelier ne peut apparaître qu'une fois par niveau.";
                        render();
                        return;
                    }
                    seenWorkshops.add(atelierId);
                    levels[level].push({ atelierId, answer });
                }
            }
            try {
                const events = {
                    ...appSettings.events,
                    [adminSelectedSeason]: { title, description, levels }
                };
                await savePublicConfiguration({ events });
                adminMessage = `Le défi ${EVENT_INFO[adminSelectedSeason].label} a été publié.`;

                adminMessage = '';

        // --- CALCUL DES SCORES VIA TIMESTAMP ---
        function getStartOfDay() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        }
        function getStartOfWeek() {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(now.getFullYear(), now.getMonth(), diff, 0, 0, 0).getTime();
        }
        function getStartOfMonth() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        }
        function getCurrentRewardMonthKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }
        function getCurrentRewardDayKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }
        function getMonthlyRewardClaimKey(rewardId, monthKey = getCurrentRewardMonthKey()) {
            return `${monthKey}_${rewardId}`;
        }
        function calculateUserScores(defis) {
            let total = 0, daily = 0, weekly = 0, monthly = 0;
            const startOfDay = getStartOfDay();
            const startOfWeek = getStartOfWeek();
            const startOfMonth = getStartOfMonth();

            if (!defis) return { total: 0, daily: 0, weekly: 0, monthly: 0 };

            ATELIERS.forEach(atelier => {
                atelier.defis.forEach(defi => {
                    const timestamp = defis[defi.id];
                    if (timestamp) {
                        const points = defi.rewardType === 'gift' ? 0 : defi.points;
                        total += points;
                        if (timestamp >= startOfDay) daily += points;
                        if (timestamp >= startOfWeek) weekly += points;
                        if (timestamp >= startOfMonth) monthly += points;
                    }
                });
            });
            return { total, daily, weekly, monthly };
        }

        function calculateMonthlyScoreForKey(defis, monthKey) {
            const [year, month] = monthKey.split('-').map(Number);
            const monthStart = new Date(year, month - 1, 1).getTime();
            const nextMonthStart = new Date(year, month, 1).getTime();
            let score = 0;
            ATELIERS.forEach(atelier => atelier.defis.forEach(defi => {
                const timestamp = Number((defis || {})[defi.id]);
                if (timestamp >= monthStart && timestamp < nextMonthStart) {
                    score += defi.rewardType === 'gift' ? 0 : defi.points;
                }
            }));
            return score;
        }

        function getEarnedMonthlyRewardEntries(defis, rewards = appSettings.monthlyRewards) {
            const months = new Set();
            Object.values(defis || {}).forEach(value => {
                const date = new Date(Number(value));
                if (!Number.isNaN(date.getTime())) {
                    months.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
                }
            });
            return [...months].flatMap(monthKey => rewards
                .filter(reward => calculateMonthlyScoreForKey(defis, monthKey) >= reward.points)
                .map(reward => ({ reward, monthKey, claimKey: getMonthlyRewardClaimKey(reward.id, monthKey) }))
            ).sort((first, second) =>
                second.monthKey.localeCompare(first.monthKey)
                || Number(first.reward.points) - Number(second.reward.points)
            );
        }

        function getActiveRewardReceptionEntries() {
            const archivedClaimIds = new Set(rewardReceptionSessions.flatMap(session =>
                Array.isArray(session.claimIds) ? session.claimIds : []
            ));
            return allUsersData.flatMap(user => getEarnedMonthlyRewardEntries(user.completedDefis || {})
                .filter(entry =>
                    !archivedClaimIds.has(`${user.id}:${entry.claimKey}`)
                )
                .map(entry => ({
                    playerId: user.id,
                    pseudo: user.pseudo || 'Anonyme',
                    rewardId: entry.reward.id,
                    rewardTitle: entry.reward.title,
                    points: entry.reward.points,
                    monthKey: entry.monthKey,
                    rewardClaimKey: entry.claimKey,
                    claimId: `${user.id}:${entry.claimKey}`,
                    lastUpdated: Number(user.lastUpdated) || 0
                }))
            ).sort((first, second) =>
                second.lastUpdated - first.lastUpdated
                || second.monthKey.localeCompare(first.monthKey)
                || first.pseudo.localeCompare(second.pseudo, 'fr')
            );
        }

        function stopRewardReceptionListeners() {
            if (rewardReceptionDayUnsubscribe) rewardReceptionDayUnsubscribe();
            if (rewardReceptionSessionsUnsubscribe) rewardReceptionSessionsUnsubscribe();
            rewardReceptionDayUnsubscribe = null;
            rewardReceptionSessionsUnsubscribe = null;
            rewardReceptionDayKey = '';
            rewardReceptionState = { currentSessionId: 1 };
            rewardReceptionSessions = [];
        }

        function syncRewardReceptionListeners() {
            if (!adminAuthorized || currentTab !== 'admin' || adminTab !== 'retraits') {
                stopRewardReceptionListeners();
                return;
            }
            const dayKey = getCurrentRewardDayKey();
            if (dayKey === rewardReceptionDayKey && rewardReceptionDayUnsubscribe) return;
            stopRewardReceptionListeners();
            rewardReceptionDayKey = dayKey;
            rewardReceptionError = '';
            const dayRef = doc(db, "rewardReceptionDays", dayKey);
            rewardReceptionDayUnsubscribe = onSnapshot(dayRef, snapshot => {
                rewardReceptionState = snapshot.exists()
                    ? { currentSessionId: Math.max(1, Number(snapshot.data().currentSessionId) || 1) }
                    : { currentSessionId: 1 };
                if (currentTab === 'admin' && adminTab === 'retraits') render();
            }, error => {
                console.error("Lecture des séances de retrait impossible :", error);
                rewardReceptionError = "Les séances de retrait ne sont pas accessibles. Vérifie les règles Firestore.";
                if (currentTab === 'admin' && adminTab === 'retraits') render();
            });
            rewardReceptionSessionsUnsubscribe = onSnapshot(
                collection(db, "rewardReceptionDays", dayKey, "sessions"),
                snapshot => {
                    rewardReceptionSessions = snapshot.docs
                        .map(sessionDoc => ({ id: sessionDoc.id, ...sessionDoc.data() }))
                        .sort((first, second) => Number(first.sessionId) - Number(second.sessionId));
                    if (currentTab === 'admin' && adminTab === 'retraits') render();
                },
                error => {
                    console.error("Lecture de l'historique des séances impossible :", error);
                    rewardReceptionError = "L'historique des séances n'est pas accessible. Vérifie les règles Firestore.";
                    if (currentTab === 'admin' && adminTab === 'retraits') render();
                }
            );
        }

            halloweenStatus = {};
            halloweenSubmitted = false;
            saveHalloweenProgress();
            render();
        };

        window.handleHalloweenInput = (atelierId, val) => {
            halloweenInputs[atelierId] = val;
            if (halloweenStatus[atelierId]) delete halloweenStatus[atelierId];
            saveHalloweenProgress();
            const btn = document.getElementById('verifyBtn');
            if (btn) {
                if (areAllFilled()) {
                    btn.disabled = false;
                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-orange-600 text-white shadow-orange-900/50 hover:bg-orange-500 cursor-pointer active:scale-95";
                } else {
                    btn.disabled = true;
                    btn.className = "px-8 py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center gap-3 bg-slate-800 text-slate-500 cursor-not-allowed opacity-60";
                }
            }
        };

        function getActiveAteliersForLevel() {
            const activeEntries = getCurrentEventEntries();
            return ATELIERS.filter(atelier => activeEntries.some(entry => entry.atelierId === atelier.id));
        }

        function areAllFilled() {
            const currentAteliers = getActiveAteliersForLevel();
            if (currentAteliers.length === 0) return false;
            return currentAteliers.every(a => {
                const val = halloweenInputs[a.id];
                return val !== undefined && val !== '' && val !== null && String(val).trim() !== '';
            });
        }

        window.verifyHalloweenAnswers = function() {
            const entries = getCurrentEventEntries();
            halloweenStatus = {};

            entries.forEach(entry => {
                if (Number(halloweenInputs[entry.atelierId]) === entry.answer) {
                    halloweenStatus[entry.atelierId] = 'correct';
                } else {
                    halloweenStatus[entry.atelierId] = 'error';
                }
            });
            halloweenSubmitted = true;
            saveHalloweenProgress();
            render();
        };

        function isCurrentEventCompleted() {
            const entries = getCurrentEventEntries();
            if (!halloweenLevel || !halloweenSubmitted || entries.length === 0) return false;
            return entries.every(entry => Number(halloweenInputs[entry.atelierId]) === entry.answer);
        }

        function syncAdminRewardDraftFromForm() {

            adminRewardDraft = adminRewardDraft.map(reward => ({
                id: reward.id,
                points: Number(formData.get(`rewardPoints_${reward.id}`)) || reward.points,
                title: String(formData.get(`rewardTitle_${reward.id}`) || reward.title).trim(),
                description: String(formData.get(`rewardDescription_${reward.id}`) || '')
            }));
        }

        window.uploadMonthlyRewardImage = async function(input) {

                console.error("Enregistrement du visuel du cadeau impossible :", error);

        window.removeMonthlyRewardImage = async function(button) {

                await deleteDoc(doc(db, "rewardImages", rewardId));
                delete rewardImages[rewardId];

        window.saveAdminMonthlyRewards = async function(event) {
            event.preventDefault();
            syncAdminRewardDraftFromForm();
            const formData = new FormData(event.currentTarget);
            const enabled = formData.get('monthlyRewardsEnabled') === 'on';
            const normalizedRewards = [];
            const seenIds = new Set();
            for (const reward of adminRewardDraft) {
                const points = Number(reward.points);
                const title = reward.title.trim();
                if (!Number.isInteger(points) || points < 1 || points > 100000 || !title || title.length > 80
                    || seenIds.has(reward.id)) {
                    adminError = "Vérifie chaque objectif : le seuil doit être entier (1 à 100 000) et le nom du cadeau est obligatoire.";
                    adminMessage = '';
                    render();
                    return;
                }
                seenIds.add(reward.id);
                normalizedRewards.push({
                    id: reward.id,
                    points,
                    title,
                    description: reward.description.trim().slice(0, 240)
                });
            }
            normalizedRewards.sort((first, second) => first.points - second.points);
            try {
                const removedRewardIds = appSettings.monthlyRewards
                    .filter(reward => !normalizedRewards.some(nextReward => nextReward.id === reward.id))
                    .map(reward => reward.id);
                await savePublicConfiguration({
                    monthlyRewardsEnabled: enabled,
                    monthlyRewards: normalizedRewards
                });
                const failedImageDeletes = [];
                for (const rewardId of removedRewardIds) {
                    try {
                        await deleteDoc(doc(db, "rewardImages", rewardId));
                        delete rewardImages[rewardId];
                    } catch (error) {
                        console.error(`Suppression de l'image du cadeau ${rewardId} impossible :`, error);
                        failedImageDeletes.push(rewardId);
                    }
                }
                adminRewardDraft = JSON.parse(JSON.stringify(appSettings.monthlyRewards));
                adminMessage = failedImageDeletes.length
                    ? "Les objectifs sont enregistrés, mais certains visuels supprimés restent dans Firestore."
                    : "La barre de progression et les objectifs cadeaux sont enregistrés.";
                adminError = '';
            } catch (error) {
                console.error("Enregistrement des objectifs cadeaux impossible :", error);
                adminError = "Enregistrement impossible. Vérifie les règles Firestore admin.";
                adminMessage = '';
            }
            render();
        };

        window.renameAdminPlayer = async function(button) {

            const input = row && row.querySelector('input[name="playerPseudo"]');

                    localStorage.setItem('climbup_pseudo', pseudo);

            } catch (error) {
                console.error("Modification du pseudo impossible :", error);

        window.deleteAdminPlayer = async function(button) {
            if (!adminAuthorized) return;
            const row = button.closest('[data-player-row]');
            const playerId = row && row.dataset.playerId;
            const player = allUsersData.find(item => item.id === playerId);

        window.openMonthlyReward = async function(rewardId, monthKey = getCurrentRewardMonthKey()) {
            const reward = appSettings.monthlyRewards.find(item => item.id === rewardId);
            const claimKey = reward && getMonthlyRewardClaimKey(reward.id, monthKey);
            const isEarned = reward && getEarnedMonthlyRewardEntries(completedDefis, [reward])
                .some(entry => entry.claimKey === claimKey);
            if (!reward || !appSettings.monthlyRewardsEnabled || !isEarned || openedMonthlyRewards.includes(claimKey)
                || openingMonthlyRewards.has(claimKey)) return;
            openingMonthlyRewards.add(claimKey);
            rewardError = '';
            try {
                await runTransaction(db, async transaction => {
                    const profileRef = doc(db, "users", userId);
                    const profileSnapshot = await transaction.get(profileRef);
                    const profile = profileSnapshot.exists() ? profileSnapshot.data() : {};
                    if (Array.isArray(profile.openedRewards) && profile.openedRewards.includes(claimKey)) {
                        throw new Error("Ce cadeau a déjà été ouvert sur un autre appareil.");
                    }
                    transaction.set(profileRef, {
                        pseudo,
                        completedDefis,
                        openedRewards: arrayUnion(claimKey),
                        lastUpdated: Date.now()
                    }, { merge: true });
                });
                openedMonthlyRewards = [...new Set([...openedMonthlyRewards, claimKey])];
                localStorage.setItem(openedMonthlyRewardsStorageKey, JSON.stringify(openedMonthlyRewards));
                selectedRewardId = reward.id;
            } catch (error) {
                console.error("Ouverture du cadeau impossible :", error);
                if (error.message === "Ce cadeau a déjà été ouvert sur un autre appareil.") {
                    openedMonthlyRewards = [...new Set([...openedMonthlyRewards, claimKey])];
                    localStorage.setItem(openedMonthlyRewardsStorageKey, JSON.stringify(openedMonthlyRewards));
                    rewardError = error.message;
                } else {
                    rewardError = "Le cadeau n'a pas pu être ouvert. Vérifie ta connexion et réessaie.";
                }
            } finally {
                openingMonthlyRewards.delete(claimKey);
            }
            render();
        };

        window.closeMonthlyReward = function() {
            selectedRewardId = null;
            render();
        };

        window.startNextRewardReceptionSession = async function() {
            if (!adminAuthorized || advancingRewardReceptionSession) return;
            const activeEntries = getActiveRewardReceptionEntries();
            if (!window.confirm(`Archiver la séance ${rewardReceptionState.currentSessionId} (${activeEntries.length} cadeau(x) restant(s)) et démarrer la suivante ?`)) return;
            advancingRewardReceptionSession = true;
            const dayKey = getCurrentRewardDayKey();
            const now = Date.now();
            try {
                await runTransaction(db, async transaction => {
                    const dayRef = doc(db, "rewardReceptionDays", dayKey);
                    const daySnapshot = await transaction.get(dayRef);
                    const currentSessionId = daySnapshot.exists()
                        ? Math.max(1, Number(daySnapshot.data().currentSessionId) || 1)
                        : 1;
                    const sessionRef = doc(db, "rewardReceptionDays", dayKey, "sessions", String(currentSessionId));
                    transaction.set(sessionRef, {
                        sessionId: currentSessionId,
                        endedAt: now,
                        entries: activeEntries,
                        claimIds: activeEntries.map(entry => entry.claimId)
                    });
                    transaction.set(dayRef, {
                        currentSessionId: currentSessionId + 1,
                        updatedAt: now
                    }, { merge: true });
                });
                adminMessage = `Séance ${rewardReceptionState.currentSessionId} archivée. La séance suivante est prête pour les nouveaux retraits.`;
                adminError = '';
            } catch (error) {
                console.error("Archivage de la séance de retrait impossible :", error);
                adminError = "Impossible d'archiver la séance et d'en créer une nouvelle. Vérifie les règles Firestore admin.";
                adminMessage = '';
            } finally {
                advancingRewardReceptionSession = false;
            }
            render();
        };

        window.markMonthlyRewardRedeemed = async function(button) {
            if (!adminAuthorized) return;
            const row = button.closest('[data-player-row]');
            const playerId = row && row.dataset.playerId;
            const rewardId = button.dataset.rewardId;
            const monthKey = button.dataset.monthKey;
            const player = allUsersData.find(item => item.id === playerId);
            const reward = appSettings.monthlyRewards.find(item => item.id === rewardId);
            const claimKey = reward && getMonthlyRewardClaimKey(reward.id, monthKey);
            if (!player || !reward || !claimKey
                || !getEarnedMonthlyRewardEntries(player.completedDefis || {}, [reward]).some(entry => entry.claimKey === claimKey)
                || (Array.isArray(player.redeemedRewards) && player.redeemedRewards.includes(claimKey))
                || claimingMonthlyRewards.has(claimKey)) return;

            claimingMonthlyRewards.add(claimKey);
            try {
                await updateDoc(doc(db, "users", playerId), {
                    redeemedRewards: arrayUnion(claimKey),
                    lastUpdated: Date.now()
                });
                const redeemedRewards = Array.isArray(player.redeemedRewards) ? player.redeemedRewards : [];
                player.redeemedRewards = [...new Set([...redeemedRewards, claimKey])];
                adminMessage = `Le cadeau « ${reward.title} » de ${player.pseudo || 'ce joueur'} a été marqué comme récupéré.`;
                adminError = '';
            } catch (error) {
                console.error("Validation du retrait de cadeau impossible :", error);
                adminError = "Le cadeau n'a pas pu être marqué comme récupéré. Vérifie les règles Firestore admin.";
                adminMessage = '';
            } finally {
                claimingMonthlyRewards.delete(claimKey);
            }
            render();
        };

                });

                            ${entries.map(entry => {

                                const redeemed = player && Array.isArray(player.redeemedRewards)
                                    && player.redeemedRewards.includes(entry.rewardClaimKey);

                const archivedSessions = rewardReceptionSessions.slice().reverse().map(session => {

            const completions = allUsersData.reduce((total, user) => {
                const done = user.completedDefis || {};
                return total + ATELIERS.reduce((count, atelier) => count + atelier.defis.filter(defi => !!done[defi.id]).length, 0);
            }, 0);
            const completionRate = participantCount && totalDefis
                ? Math.round(completions / (participantCount * totalDefis) * 100)
                : 0;
            const selectedWorkshop = adminWorkshopDraft.id === adminSelectedWorkshop
                ? adminWorkshopDraft
                : ATELIERS.find(atelier => atelier.id === adminSelectedWorkshop) || ATELIERS[0];
            const selectedEvent = appSettings.events[adminSelectedSeason];
            const eventOptions = Object.keys(EVENT_INFO).map(key =>
                `<option value="${key}" ${key === adminSelectedSeason ? 'selected' : ''}>${EVENT_INFO[key].label}</option>`
            ).join('');
            const workshopOptions = ATELIERS.map(atelier =>
                `<option value="${atelier.id}" ${atelier.id === selectedWorkshop.id ? 'selected' : ''}>${escapeHtml(atelier.name)}</option>`
            ).join('');
            const modeOptions = VALID_MODES.map(mode => {
                const label = mode === 'classic' ? 'Classique (sans défi saisonnier)' : EVENT_INFO[mode].label;
                return `<option value="${mode}" ${appSettings.mode === mode ? 'selected' : ''}>${label}</option>`;
            }).join('');
            const skinOptions = VALID_SKINS.map(skin => {
                const label = skin === 'classic' ? 'Classique' : EVENT_INFO[skin].label;
                return `<option value="${skin}" ${appSettings.skin === skin ? 'selected' : ''}>${label}</option>`;
            }).join('');
            const challengeStats = ATELIERS.flatMap(atelier => atelier.defis.map(defi => {
                const completedCount = allUsersData.filter(user => !!(user.completedDefis || {})[defi.id]).length;
                const rate = participantCount ? Math.round(completedCount / participantCount * 100) : 0;
                return `
                    <div class="flex items-center gap-3 border-b border-gray-100 py-3 last:border-0">
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-bold text-gray-800">${escapeHtml(atelier.name)} · ${escapeHtml(defi.text)}</p>
                            <p class="text-xs text-gray-500">${completedCount} validation(s) / ${participantCount} profil(s)</p>
                        </div>
                        <div class="font-black text-purple-700">${rate}%</div>
                    </div>
                `;
            })).join('');
            const currentMonthlyRewards = appSettings.monthlyRewards
                .slice()
                .sort((first, second) => Number(first.points) - Number(second.points));
            const allEarnedRewardEntries = allUsersData.flatMap(user =>
                getEarnedMonthlyRewardEntries(user.completedDefis || {}).map(entry => ({ ...entry, user }))
            );
            const monthlyRewardStats = currentMonthlyRewards.map(reward => {
                const rewardEntries = allEarnedRewardEntries.filter(entry => entry.reward.id === reward.id);
                const redeemedCount = rewardEntries.filter(entry =>
                    Array.isArray(entry.user.redeemedRewards) && entry.user.redeemedRewards.includes(entry.claimKey)
                ).length;
                return `
                    <div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3 border-b border-gray-100 py-3 last:border-0">
                        <div class="min-w-0">
                            <p class="truncate font-bold text-gray-800">${escapeHtml(reward.title)}</p>
                            <p class="text-xs text-gray-500">Objectif : ${reward.points} pts · ${rewardEntries.length} gagné(s) · ${redeemedCount} récupéré(s)</p>
                        </div>
                        <span class="rounded-full bg-purple-50 px-3 py-1 text-sm font-black text-purple-700">${rewardEntries.length - redeemedCount} à récupérer</span>
                    </div>
                `;
            }).join('');
            const playerRows = [...allUsersData]
                .sort((first, second) => String(first.pseudo || '').localeCompare(String(second.pseudo || ''), 'fr'))
                .map(user => `
                    <div data-player-row data-player-id="${escapeHtml(user.id)}" class="grid gap-3 border-b border-gray-100 py-3 last:border-0 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">
                        <div class="min-w-0">
                            <label class="sr-only" for="player-pseudo-${escapeHtml(user.id)}">Pseudo du joueur</label>
                            <input id="player-pseudo-${escapeHtml(user.id)}" name="playerPseudo" maxlength="30" value="${escapeHtml(user.pseudo || '')}" class="w-full rounded-lg border border-gray-200 px-3 py-2 font-bold text-gray-800" />
                            <p class="mt-1 text-xs text-gray-500">${calculateUserScores(user.completedDefis || {}).total} pts · profil ${escapeHtml(String(user.id).slice(0, 14))}</p>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="renameAdminPlayer(this)" class="flex-1 rounded-lg bg-purple-50 px-3 py-2 text-sm font-bold text-purple-700 sm:flex-none">Renommer</button>

                        </div>
                    </div>
                `).join('');
            const rewardEditorRows = adminRewardDraft
                .slice()
                .sort((first, second) => Number(first.points) - Number(second.points))
                .map(reward => `
                    <article class="grid gap-4 rounded-2xl border border-purple-100 bg-purple-50/40 p-4 lg:grid-cols-[minmax(0,1fr)_180px]">
                        <div class="space-y-3">
                            <div class="grid gap-3 sm:grid-cols-2">
                                <label class="text-sm font-bold text-gray-600">Objectif en points
                                    <input name="rewardPoints_${escapeHtml(reward.id)}" type="number" min="1" max="100000" step="1" required value="${escapeHtml(reward.points)}" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2" />
                                </label>
                                <label class="text-sm font-bold text-gray-600">Nom du cadeau
                                    <input name="rewardTitle_${escapeHtml(reward.id)}" maxlength="80" required value="${escapeHtml(reward.title)}" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2" />

                            </label>
                            <button type="button" data-reward-id="${escapeHtml(reward.id)}" onclick="removeAdminMonthlyReward(this)" class="rounded-lg bg-red-50 px-3 py-2 text-sm font-bold text-red-700">Supprimer cet objectif</button>
                        </div>
                        <div class="space-y-2">
                            <div class="flex h-32 items-center justify-center overflow-hidden rounded-xl border border-white bg-white">
                                ${rewardImages[reward.id] ? `<img src="${escapeHtml(rewardImages[reward.id])}" alt="Visuel du cadeau ${escapeHtml(reward.title)}" class="h-full w-full object-cover" />` : '<span class="text-5xl" aria-hidden="true">🎁</span>'}

                            <label class="block text-xs font-bold text-gray-600">Visuel à révéler

                        </div>
                    </article>
                `).join('');
            const eventChallengeRows = LEVEL_KEYS.map(level => {
                const entries = adminEventDraft.levels[level] || [];
                return `
                    <section class="rounded-2xl border border-gray-200 p-4">
                        <div class="mb-3 flex items-center justify-between">
                            <h3 class="font-black capitalize">${level}</h3>
                            <button type="button" onclick="addAdminEventChallenge('${level}')" class="rounded-lg bg-purple-50 px-3 py-2 text-sm font-bold text-purple-700">+ Ajouter une énigme</button>

                        ${entries.length ? entries.map((entry, index) => `

                                <select name="atelier_${level}_${index}" class="min-w-0 rounded-lg border border-gray-200 px-3 py-2">
                                    ${ATELIERS.map(atelier => `<option value="${atelier.id}" ${entry.atelierId === atelier.id ? 'selected' : ''}>${escapeHtml(atelier.name)}</option>`).join('')}
                                </select>
                                <input name="answer_${level}_${index}" type="number" step="any" value="${escapeHtml(entry.answer)}" required aria-label="Réponse attendue" class="rounded-lg border border-gray-200 px-3 py-2" />
                                <button type="button" onclick="removeAdminEventChallenge('${level}', ${index})" aria-label="Supprimer l'énigme" class="rounded-lg bg-red-50 px-3 py-2 font-bold text-red-700">Supprimer</button>
                            </div>
                        `).join('') : '<p class="text-sm text-gray-400">Aucune énigme configurée pour ce niveau.</p>'}
                    </section>
                `;

            return `
                <section class="space-y-6 p-4 pb-10">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div><h1 class="text-3xl font-black">Administration</h1><p class="text-sm text-gray-500">${escapeHtml(adminUser.email || '')}</p></div>

                    ${notice}
                    ${appConfigError ? `<div role="alert" class="rounded-xl border border-amber-200 bg-amber-50 p-4 font-bold text-amber-800">${escapeHtml(appConfigError)}</div>` : ''}

                    <div class="grid gap-4 sm:grid-cols-3">

                        <article class="rounded-2xl bg-white p-5 shadow-sm"><p class="text-sm font-bold text-gray-500">Défis validés / possibilités</p><p class="mt-2 text-3xl font-black">${completionRate}%</p></article>
                    </div>
                    <p class="text-xs text-gray-500">Les statistiques comptent les profils enregistrés dans Firestore ; un même joueur peut avoir plusieurs profils sur différents appareils.</p>

                        <div class="mb-2">

                        <div class="max-h-72 overflow-y-auto">
                            ${monthlyRewardStats || '<p class="py-4 text-sm text-gray-400">Aucun palier cadeau configuré.</p>'}

                    <form onsubmit="saveAdminSettings(event)" class="space-y-4 rounded-2xl bg-white p-5 shadow-sm">

                            </label>
                            <label class="text-sm font-bold text-gray-600">Skin visuel
                                <select name="skin" class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-3">${skinOptions}</select>
                            </label>
                        </div>
                        <label class="flex items-center gap-3 font-bold"><input name="challengeEnabled" type="checkbox" ${appSettings.challengeEnabled ? 'checked' : ''} class="h-5 w-5 accent-purple-600" /> Activer le défi saisonnier</label>
                        <button class="rounded-xl bg-purple-600 px-5 py-3 font-black text-white">Publier les paramètres</button>
                    </form>

                    <section class="space-y-4 rounded-2xl bg-white p-5 shadow-sm">
                        <div>
                            <h2 class="text-xl font-black">Progression et cadeaux mensuels</h2>
                            <p class="text-sm text-gray-500">Chaque joueur repart à zéro au début du mois. Un cadeau gagné peut être ouvert dans l'application, puis présenté à l'accueil.</p>
                        </div>
                        <form data-monthly-rewards-form onsubmit="saveAdminMonthlyRewards(event)" class="space-y-4">
                            <label class="flex items-center gap-3 font-bold text-gray-700">
                                <input name="monthlyRewardsEnabled" type="checkbox" ${appSettings.monthlyRewardsEnabled ? 'checked' : ''} class="h-5 w-5 accent-purple-600" />
                                Afficher la progression et les cadeaux aux joueurs
                            </label>
                            <div class="space-y-3">
                                ${rewardEditorRows || '<p class="rounded-xl bg-gray-50 p-4 text-sm text-gray-500">Aucun palier cadeau. Ajoute un objectif pour commencer.</p>'}
                            </div>
                            <div class="flex flex-wrap gap-3">
                                <button type="button" onclick="addAdminMonthlyReward()" class="rounded-xl border border-purple-200 bg-purple-50 px-4 py-3 font-bold text-purple-700">+ Ajouter un palier cadeau (${adminRewardDraft.length}/20)</button>
                                <button type="submit" class="rounded-xl bg-purple-600 px-5 py-3 font-black text-white">Enregistrer la progression</button>
                            </div>
                        </form>
                    </section>

                    <section class="rounded-2xl bg-white p-5 shadow-sm">
                        <div class="mb-3">
                            <h2 class="text-xl font-black">Gestion des joueurs</h2>
                            <p class="text-sm text-gray-500">Renommer un pseudo problématique ou supprimer son profil et ses points du classement partagé. La gestion des retraits est dans l'onglet dédié.</p>
                        </div>
                        <div class="max-h-[32rem] overflow-y-auto">
                            ${playerRows || '<p class="py-4 text-sm text-gray-400">Aucun profil joueur enregistré.</p>'}
                        </div>
                    </section>

                    <div class="grid gap-6 xl:grid-cols-2">
                        <div class="space-y-4 rounded-2xl bg-white p-5 shadow-sm">
                            <div class="flex flex-wrap items-start justify-between gap-3">
                                <div><h2 class="text-xl font-black">Personnaliser un atelier</h2><p class="text-sm text-gray-500">Les identifiants restent fixes pour conserver les validations. Modifier les points recalcule aussi les scores déjà enregistrés. Supprimer un défi retire ses validations des scores.</p></div>
                                <button type="button" onclick="addAdminWorkshop()" class="shrink-0 rounded-xl bg-purple-50 px-4 py-2 font-bold text-purple-700">+ Ajouter un atelier</button>
                            </div>
                            <label class="block text-sm font-bold text-gray-600">Atelier
                                <select onchange="selectAdminWorkshop(this.value)" class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-3">${workshopOptions}</select>
                            </label>
                            <div class="overflow-hidden rounded-xl border border-gray-200">
                                <div class="relative h-36 bg-gray-100">${getAtelierPreview(selectedWorkshop)}</div>
                                <div class="space-y-3 p-3">
                                    <label class="block text-sm font-bold text-gray-700">Image miniature
                                        <input type="file" accept="image/*" onchange="uploadWorkshopImage(this)" class="mt-2 block w-full text-sm font-medium text-gray-600 file:mr-3 file:rounded-lg file:border-0 file:bg-purple-50 file:px-3 file:py-2 file:font-bold file:text-purple-700" />
                                    </label>
                                    <p class="text-xs text-gray-500">L'image est redimensionnée et compressée avant son enregistrement. Fichier d'origine : 20 Mo maximum.</p>
                                    ${workshopImages[selectedWorkshop.id] ? '<button type="button" onclick="removeWorkshopImage()" class="rounded-lg bg-red-50 px-3 py-2 text-sm font-bold text-red-700">Supprimer la miniature personnalisée</button>' : ''}
                                </div>
                            </div>
                            <form data-admin-workshop-form onsubmit="saveAdminWorkshop(event)" class="space-y-3">
                                <input type="hidden" name="workshopId" value="${selectedWorkshop.id}" />
                                <label class="block text-sm font-bold text-gray-600">Nom
                                    <input name="workshopName" maxlength="80" required value="${escapeHtml(selectedWorkshop.name)}" class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-3" />
                                </label>
                                ${selectedWorkshop.defis.map(defi => `
                                    <div data-admin-defi="${defi.id}" class="space-y-3 rounded-xl bg-gray-50 p-3">
                                        <div class="flex items-start gap-2">
                                            <label class="min-w-0 flex-1 text-xs font-bold text-gray-500">Texte du défi
                                                <input name="text_${defi.id}" maxlength="160" required value="${escapeHtml(defi.text)}" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm" />

                                                            <input class="sr-only" type="radio" name="color_${defi.id}" value="${colorKey}" aria-label="${color.label}" ${defi.color === colorKey ? 'checked' : ''} />
                                                            <span class="block h-7 w-7 rounded-full ${color.swatch} transition-transform"></span>
                                                        </label>
                                                    `).join('')}
                                                </div>
                                            </fieldset>
                                            <label class="text-xs font-bold text-gray-500">Récompense
                                                <select name="rewardType_${defi.id}" onchange="toggleAdminRewardFields('${defi.id}', this.value)" class="mt-1 w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm">
                                                    <option value="points" ${defi.rewardType !== 'gift' ? 'selected' : ''}>Points</option>
                                                    <option value="gift" ${defi.rewardType === 'gift' ? 'selected' : ''}>Cadeau (sans points)</option>
                                                </select>
                                            </label>
                                        </div>
                                        <label data-reward-field="points" class="${defi.rewardType === 'gift' ? 'hidden' : 'block'} text-xs font-bold text-gray-500">Points attribués
                                            <input name="points_${defi.id}" type="number" min="1" max="100" step="1" ${defi.rewardType === 'gift' ? 'disabled' : 'required'} value="${defi.points || 5}" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm" />
                                        </label>
                                        <label data-reward-field="gift" class="${defi.rewardType === 'gift' ? 'block' : 'hidden'} text-xs font-bold text-gray-500">Texte / emoji du cadeau
                                            <input name="rewardText_${defi.id}" maxlength="80" ${defi.rewardType === 'gift' ? 'required' : 'disabled'} value="${escapeHtml(defi.rewardText || '')}" placeholder="Ex. 🎁 Cadeau surprise" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm" />
                                        </label>
                                    </div>
                                `).join('')}
                                <button type="button" onclick="addAdminWorkshopChallenge()" class="rounded-xl border border-purple-200 bg-purple-50 px-4 py-3 font-bold text-purple-700">+ Ajouter un défi (${selectedWorkshop.defis.length}/10)</button>
                                <button class="rounded-xl bg-purple-600 px-5 py-3 font-black text-white">Enregistrer l'atelier</button>
                            </form>
                            <button type="button" onclick="deleteAdminWorkshop()" ${ATELIERS.length <= 1 ? 'disabled' : ''} class="rounded-xl border border-red-200 bg-white px-4 py-3 font-bold text-red-700 disabled:cursor-not-allowed disabled:opacity-40">Supprimer cet atelier</button>
                        </div>

                        <form onsubmit="saveAdminEvent(event)" class="space-y-4 rounded-2xl bg-white p-5 shadow-sm">
                            <div><h2 class="text-xl font-black">Défis saisonniers</h2><p class="text-sm text-gray-500">Configure les énigmes et leurs réponses attendues pour Noël, Pâques et Halloween.</p></div>

                                <textarea name="eventDescription" maxlength="300" rows="2" class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-3">${escapeHtml(adminEventDraft.description)}</textarea>

                </section>

        // --- RENDU ---
        function render() {
            const app = document.getElementById('app');
            const activeEventInfo = EVENT_INFO[appSettings.mode];
            const challengeAvailable = appSettings.challengeEnabled && !!activeEventInfo;
            const isAdminView = currentTab === 'admin';
            const skin = isAdminView ? 'classic' : appSettings.skin;
            const isHalloween = !isAdminView && skin === 'halloween';
            const isSeasonal = !isAdminView && skin !== 'classic' && !!activeEventInfo;

            if (!isLogged && currentTab !== 'admin') {
                app.innerHTML = `
                    <div class="app-shell theme-classic min-h-screen flex items-center justify-center p-4">
                        <div class="relative w-full max-w-md overflow-hidden rounded-[2rem] border border-white/80 bg-white/90 p-8 text-center shadow-[0_24px_70px_rgba(76,29,149,0.16)] backdrop-blur-xl">
                            <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-gradient-to-br from-purple-600 to-teal-400 shadow-lg shadow-purple-200 ring-8 ring-purple-50">
                                <i data-lucide="mountain" class="text-white w-12 h-12"></i>
                            </div>
                            <h1 onclick="openAdminGate()" class="mb-2 bg-gradient-to-r from-purple-700 to-teal-500 bg-clip-text text-3xl font-black text-transparent">Climb Up</h1>
                            <p class="mb-8 font-medium text-gray-500">Fun Climbing <span class="mx-1 text-purple-300">•</span> Défis</p>
                            
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
